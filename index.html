const bkGroupConfig = {
  skip:     { label:"Sem bokashi",                       color:"#c0392b", icon:"🚫" },
  monthly:  { label:"A cada 4 semanas",                  color:"#7b6fa0", icon:"🌵" },
  biweekly: { label:"A cada 2 semanas",                  color:"#2e8b57", icon:"🌿" },
  boost:    { label:"A cada 2 semanas — dose reforçada", color:"#c07800", icon:"🌱" },
};
const bkExtraColors = {
  forthflores:{ color:"#b03060", bg:"#fdf0f4", icon:"🌸" },
  hidro:      { color:"#1a7ab5", bg:"#eaf4fb", icon:"💧" },
  calcio:     { color:"#d4670a", bg:"#fef4ec", icon:"🧡" },
  orquidea:   { color:"#7b3fa0", bg:"#f5f0fb", icon:"🪷" },
  rosadeserto:{ color:"#c2185b", bg:"#fdeef3", icon:"🌷" },
  rega:       { color:"#2a8fc1", bg:"#eaf6fc", icon:"💦" },
};

function bkDaysAgo(dateStr){ if(!dateStr)return null; return Math.floor((Date.now()-new Date(dateStr).getTime())/86400000); }
function bkGetStatus(intervalDays,dateStr){
  const d=bkDaysAgo(dateStr);
  if(d===null)return"pending";
  if(d>=intervalDays)return"due";
  if(d>=intervalDays-3)return"soon";
  return"ok";
}
const bkStatusStyle={
  pending:{ label:"Nunca aplicado", color:"#999" },
  due:    { label:"Hora de aplicar!", color:"#c0392b" },
  soon:   { label:"Em breve",        color:"#c07800" },
  ok:     { label:"Em dia ✓",        color:"#2e8b57" },
};

// Calcula plantas que faltam adubar NESTE MÊS
// "Falta" = nunca aplicado OU vence dentro do mês corrente (intervalDays calculado por mês)
function bkCountPendingThisMonth(bkDates, exDates, plants){
  plants = plants || bkPlants;
  const now=new Date();
  const daysInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const dayOfMonth=now.getDate();
  const daysLeft=daysInMonth-dayOfMonth;

  let count=0;
  plants.forEach(p=>{
    if(p.group==='skip')return;
    const st=bkGetStatus(p.intervalDays,bkDates[p.id]);
    if(st==='due'||st==='pending'||st==='soon')count++;
    (p.extras||[]).forEach(ex=>{
      const key=`${p.id}_${ex.type}`;
      const exSt=bkGetStatus(ex.interval,exDates[key]);
      if(exSt==='due'||exSt==='pending'||exSt==='soon')count++;
    });
  });
  return count;
}

// Plantas adicionadas pela usuária (persistidas localmente)
const CUSTOM_PLANTS_KEY='bokashi_custom_plants_v1';
function bkLoadCustomPlants(){
  try{ const r=JSON.parse(localStorage.getItem(CUSTOM_PLANTS_KEY)||'[]'); return Array.isArray(r)?r:[]; }catch{ return []; }
}
function bkSaveCustomPlants(arr){ try{ localStorage.setItem(CUSTOM_PLANTS_KEY,JSON.stringify(arr)); }catch{} }

const bkNewPlantGroupOptions=[
  { value:"monthly",  label:"🌵 Mensal (a cada 4 semanas)",     intervalDays:28, defaultDose:"½ col. chá" },
  { value:"biweekly", label:"🌿 Quinzenal (a cada 2 semanas)",   intervalDays:14, defaultDose:"1 col. chá" },
  { value:"boost",    label:"🌱 Quinzenal — dose reforçada",     intervalDays:14, defaultDose:"1½ col. chá" },
  { value:"skip",     label:"🚫 Aguardando (sem adubação ainda)",intervalDays:null, defaultDose:"" },
];

function BokashiApp(){
  const [bkDates,setBkDates] = React.useState(()=>bkLoad(BK_KEY));
  const [exDates,setExDates] = React.useState(()=>{
    const ex=bkLoad(EX_KEY);
    // Orquídeas marcadas na primeira abertura se não tiverem data
    let changed=false;
    if(!ex['2_orquidea']){ex['2_orquidea']=new Date().toISOString();changed=true;}
    if(!ex['3_orquidea']){ex['3_orquidea']=new Date().toISOString();changed=true;}
    if(changed)bkSave(EX_KEY,ex);
    return ex;
  });
  const [filter,setFilter]  = React.useState("all");
  const [search,setSearch]  = React.useState("");
  const [flashBk,setFlashBk]= React.useState({});
  const [flashEx,setFlashEx]= React.useState({});
  const [customPlants,setCustomPlants] = React.useState(()=>bkLoadCustomPlants());
  const [showAddForm,setShowAddForm] = React.useState(false);
  const [newPlant,setNewPlant] = React.useState({name:"",group:"monthly",dose:"",note:""});

  const allPlants = React.useMemo(()=>[...bkPlants, ...customPlants], [customPlants]);

  function addCustomPlant(){
    const name=newPlant.name.trim();
    if(!name)return;
    const cfg=bkNewPlantGroupOptions.find(o=>o.value===newPlant.group)||bkNewPlantGroupOptions[0];
    const plant={
      id:`custom_${Date.now()}`,
      name,
      group:cfg.value,
      note:newPlant.note.trim()||undefined,
      custom:true,
    };
    if(cfg.value!=='skip'){
      plant.dose = newPlant.dose.trim() || cfg.defaultDose;
      plant.intervalDays = cfg.intervalDays;
    }
    const updated=[...customPlants, plant];
    setCustomPlants(updated); bkSaveCustomPlants(updated);
    setNewPlant({name:"",group:"monthly",dose:"",note:""});
    setShowAddForm(false);
  }
  function removeCustomPlant(id){
    const updated=customPlants.filter(p=>p.id!==id);
    setCustomPlants(updated); bkSaveCustomPlants(updated);
    // limpa datas associadas
    const bk={...bkDates}; if(bk[id]){delete bk[id]; setBkDates(bk); bkSave(BK_KEY,bk);}
    const ex={...exDates}; let exChanged=false;
    Object.keys(ex).forEach(k=>{ if(k.startsWith(`${id}_`)){delete ex[k]; exChanged=true;} });
    if(exChanged){ setExDates(ex); bkSave(EX_KEY,ex); }
  }

  // Verifica virada de mês — arquiva se mudou
  React.useEffect(()=>{
    const savedMonth=localStorage.getItem('bokashi_current_month');
    const thisMonth=bkMonthKey();
    if(savedMonth && savedMonth!==thisMonth){
      // Arquiva mês anterior
      const hist=bkLoad(BK_HIST);
      const pending=bkCountPendingThisMonth(bkLoad(BK_KEY),bkLoad(EX_KEY),allPlants);
      hist[savedMonth]={ applied: Object.keys(bkLoad(BK_KEY)).length, pending };
      bkSave(BK_HIST,hist);
    }
    localStorage.setItem('bokashi_current_month',thisMonth);
  },[]);

  function bkFlash(setter,key){ setter(p=>({...p,[key]:true})); setTimeout(()=>setter(p=>{const n={...p};delete n[key];return n;}),1800); }

  function applyBokashi(id){
    const u={...bkDates,[id]:new Date().toISOString()};
    setBkDates(u);bkSave(BK_KEY,u);bkFlash(setFlashBk,id);
  }
  function resetBokashi(id){
    const u={...bkDates};delete u[id];setBkDates(u);bkSave(BK_KEY,u);
  }
  function applyExtra(id,type){
    const key=`${id}_${type}`;
    const u={...exDates,[key]:new Date().toISOString()};
    setExDates(u);bkSave(EX_KEY,u);bkFlash(setFlashEx,key);
  }
  function resetExtra(id,type){
    const key=`${id}_${type}`;
    const u={...exDates};delete u[key];setExDates(u);bkSave(EX_KEY,u);
  }

  const plantIsDue=p=>{
    const bk=p.group!=='skip'?bkGetStatus(p.intervalDays,bkDates[p.id]):null;
    if(bk==='due'||bk==='pending')return true;
    return(p.extras||[]).some(e=>{ const s=bkGetStatus(e.interval,exDates[`${p.id}_${e.type}`]); return s==='due'||s==='pending'; });
  };

  // Conta todas as plantas que têm algo para adubar (bokashi OU extras)
  let countOk=0, countPending=0;
  allPlants.forEach(p=>{
    const hasExtras=(p.extras||[]).length>0;
    const hasBokashi=p.group!=='skip';
    if(!hasBokashi&&!hasExtras)return; // plantas skip sem extras — ignora

    let allOk=true;
    if(hasBokashi){
      const bkSt=bkGetStatus(p.intervalDays,bkDates[p.id]);
      if(bkSt!=='ok'&&bkSt!=='soon')allOk=false;
    }
    if(hasExtras){
      const extrasOk=(p.extras||[]).every(ex=>{
        const s=bkGetStatus(ex.interval,exDates[`${p.id}_${ex.type}`]);
        return s==='ok'||s==='soon';
      });
      if(!extrasOk)allOk=false;
    }
    if(allOk)countOk++; else countPending++;
  });
  const pendingCount=countPending;
  const doneThisMonth=countOk;

  const visible=allPlants.filter(p=>{
    if(!p.name.toLowerCase().includes(search.toLowerCase()))return false;
    if(filter==='all')return true;
    if(filter==='due')return plantIsDue(p);
    if(filter==='extras')return!!(p.extras?.length);
    if(filter==='prop')return p.group==='skip'&&!p.extras?.length;
    return p.group===filter;
  });

  const e=React.createElement;
  const GROUPS=['skip','monthly','biweekly','boost'];

  // Mês por extenso
  const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const now=new Date();
  const mesLabel=`${meses[now.getMonth()]} ${now.getFullYear()}`;

  return e('div',{style:{fontFamily:"'DM Sans',sans-serif",minHeight:"100vh",background:"#f7f5f0",paddingBottom:60}},

    // Header
    e('div',{style:{background:"linear-gradient(135deg,#2e5c3a,#1e3d27)",padding:"28px 20px 20px",textAlign:"center"}},
      e('div',{style:{fontSize:28,marginBottom:4}},"🪴"),
      e('h1',{style:{color:"#e8f5ec",margin:0,fontSize:20,fontWeight:700,letterSpacing:1}},"Plantas · Rotina de Adubação"),
      e('p',{style:{color:"#a8d5b5",margin:"6px 0 0",fontSize:13}},mesLabel),

      // Contador mensal
      e('div',{style:{marginTop:14,display:"flex",justifyContent:"center",gap:12,flexWrap:"wrap"}},
        e('div',{style:{background:"rgba(255,255,255,.12)",borderRadius:12,padding:"8px 16px",textAlign:"center",minWidth:80}},
          e('div',{style:{fontSize:22,fontWeight:700,color:"#fff"}},(pendingCount>0?'⚠ ':'✅ ')+pendingCount),
          e('div',{style:{fontSize:11,color:"#a8d5b5",marginTop:2}},pendingCount===1?"aplicação pendente":"aplicações pendentes")
        ),
        e('div',{style:{background:"rgba(255,255,255,.12)",borderRadius:12,padding:"8px 16px",textAlign:"center",minWidth:80}},
          e('div',{style:{fontSize:22,fontWeight:700,color:"#fff"}},"✓ "+doneThisMonth),
          e('div',{style:{fontSize:11,color:"#a8d5b5",marginTop:2}},"em dia neste mês")
        )
      )
    ),

    // Filtros
    e('div',{style:{display:"flex",gap:8,padding:"12px 16px 0",overflowX:"auto"}},
      ...[{key:"all",label:"Todas"},{key:"due",label:"🔔 Pendentes"},{key:"biweekly",label:"🌿 Quinzenais"},{key:"monthly",label:"🌵 Mensais"},{key:"boost",label:"🌱 Reforçadas"},{key:"extras",label:"✨ Com reforço"},{key:"prop",label:"🪴 Aguardando"}].map(f=>
        e('button',{key:f.key,onClick:()=>setFilter(f.key),style:{whiteSpace:"nowrap",padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,
          background:filter===f.key?"#2e5c3a":"#e8e4dd",color:filter===f.key?"#fff":"#555",fontFamily:"inherit",fontWeight:filter===f.key?"bold":"normal"}},f.label)
      )
    ),

    // Busca
    e('div',{style:{padding:"10px 16px 0"}},
      e('input',{value:search,onChange:ev=>setSearch(ev.target.value),placeholder:"🔍  Buscar planta...",
        style:{width:"100%",boxSizing:"border-box",padding:"10px 14px",borderRadius:10,border:"1px solid #d4cfc5",background:"#fff",fontSize:14,fontFamily:"inherit",outline:"none"}})
    ),

    // Botão Nova Planta
    e('div',{style:{padding:"10px 16px 0"}},
      e('button',{onClick:()=>setShowAddForm(s=>!s),style:{width:"100%",boxSizing:"border-box",padding:"10px 14px",borderRadius:10,border:"1px dashed #2e5c3a",background:showAddForm?"#e8f0ea":"#fff",color:"#2e5c3a",fontSize:13,fontFamily:"inherit",fontWeight:"bold",cursor:"pointer"}},showAddForm?"✕ Cancelar":"➕ Adicionar nova planta")
    ),

    // Formulário Nova Planta
    showAddForm&&e('div',{style:{margin:"10px 16px 0",background:"#fff",borderRadius:12,padding:"14px",boxShadow:"0 1px 4px rgba(0,0,0,.07)",display:"flex",flexDirection:"column",gap:8}},
      e('div',{style:{fontSize:12,fontWeight:"bold",color:"#2e5c3a",marginBottom:2}},"🌱 Nova planta"),
      e('input',{value:newPlant.name,onChange:ev=>setNewPlant(p=>({...p,name:ev.target.value})),placeholder:"Nome da planta",
        style:{width:"100%",boxSizing:"border-box",padding:"9px 12px",borderRadius:8,border:"1px solid #d4cfc5",fontSize:13,fontFamily:"inherit",outline:"none"}}),
      e('select',{value:newPlant.group,onChange:ev=>setNewPlant(p=>({...p,group:ev.target.value})),
        style:{width:"100%",boxSizing:"border-box",padding:"9px 12px",borderRadius:8,border:"1px solid #d4cfc5",fontSize:13,fontFamily:"inherit",outline:"none",background:"#fff"}},
        ...bkNewPlantGroupOptions.map(o=>e('option',{key:o.value,value:o.value},o.label))
      ),
      newPlant.group!=='skip'&&e('input',{value:newPlant.dose,onChange:ev=>setNewPlant(p=>({...p,dose:ev.target.value})),
        placeholder:`Dose (ex: ${(bkNewPlantGroupOptions.find(o=>o.value===newPlant.group)||{}).defaultDose||"½ col. chá"})`,
        style:{width:"100%",boxSizing:"border-box",padding:"9px 12px",borderRadius:8,border:"1px solid #d4cfc5",fontSize:13,fontFamily:"inherit",outline:"none"}}),
      e('input',{value:newPlant.note,onChange:ev=>setNewPlant(p=>({...p,note:ev.target.value})),placeholder:"Observação (opcional)",
        style:{width:"100%",boxSizing:"border-box",padding:"9px 12px",borderRadius:8,border:"1px solid #d4cfc5",fontSize:13,fontFamily:"inherit",outline:"none"}}),
      e('button',{onClick:addCustomPlant,disabled:!newPlant.name.trim(),style:{padding:"9px 14px",borderRadius:8,border:"none",background:newPlant.name.trim()?"#2e5c3a":"#cfd6cf",color:"#fff",fontSize:13,fontFamily:"inherit",fontWeight:"bold",cursor:newPlant.name.trim()?"pointer":"default"}},"Adicionar planta")
    ),

    // Grupos de plantas
    ...GROUPS.map(g=>{
      const gPlants=visible.filter(p=>p.group===g);
      if(!gPlants.length)return null;
      const cfg=bkGroupConfig[g];
      return e('div',{key:g,style:{padding:"0 16px",marginTop:18}},
        e('div',{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
          e('span',{style:{fontSize:16}},cfg.icon),
          e('span',{style:{fontSize:12,fontWeight:"bold",color:cfg.color,textTransform:"uppercase",letterSpacing:.9}},cfg.label)
        ),
        e('div',{style:{display:"flex",flexDirection:"column",gap:10}},
          ...gPlants.map(plant=>{
            const bkSt=plant.group!=='skip'?bkGetStatus(plant.intervalDays,bkDates[plant.id]):null;
            const bkDa=bkDaysAgo(bkDates[plant.id]);
            const stStyle=bkSt?bkStatusStyle[bkSt]:null;
            return e('div',{key:plant.id,style:{background:"#fff",borderRadius:14,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.07)",borderLeft:`4px solid ${cfg.color}`}},
              e('div',{style:{padding:"12px 16px 6px",fontWeight:"bold",fontSize:15,color:"#2a2a2a"}},plant.name),

              // Bokashi row
              plant.group!=='skip'&&e('div',{style:{margin:"0 12px 6px",background:"#f2f7f4",borderRadius:10,padding:"10px 12px",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},
                e('div',{style:{flex:1}},
                  e('div',{style:{fontSize:12,fontWeight:"bold",color:"#2e5c3a"}},`🟢 Bokashi · ${plant.dose}`),
                  plant.note&&e('div',{style:{fontSize:11,color:"#999",fontStyle:"italic",marginTop:2}},`⚠️ ${plant.note}`),
                  e('div',{style:{display:"flex",alignItems:"center",gap:5,marginTop:5}},
                    e('span',{style:{fontSize:11,fontWeight:"bold",color:stStyle.color,background:stStyle.color+"18",padding:"2px 9px",borderRadius:20}},stStyle.label),
                    bkDa!==null&&e('span',{style:{fontSize:11,color:"#bbb"}},`há ${bkDa} dia${bkDa!==1?"s":""}`)
                  )
                ),
                e('div',{style:{display:"flex",flexDirection:"column",gap:5,marginLeft:10}},
                  e('button',{onClick:()=>applyBokashi(plant.id),style:{background:flashBk[plant.id]?"#5a9e6f":cfg.color,color:"#fff",border:"none",borderRadius:8,padding:"7px 13px",cursor:"pointer",fontSize:12,fontFamily:"inherit",fontWeight:"bold",minWidth:82}},flashBk[plant.id]?"✓ Feito!":"Aplicar"),
                  bkDates[plant.id]&&e('button',{onClick:()=>resetBokashi(plant.id),style:{background:"transparent",color:"#ccc",border:"1px solid #e5e0d8",borderRadius:8,padding:"3px 8px",cursor:"pointer",fontSize:10,fontFamily:"inherit"}},"Resetar")
                )
              ),

              // Extras
              ...(plant.extras||[]).map((ex,i)=>{
                const ecfg=bkExtraColors[ex.type];
                const exKey=`${plant.id}_${ex.type}`;
                const exSt=bkGetStatus(ex.interval,exDates[exKey]);
                const exStStyle=bkStatusStyle[exSt];
                const exDa=bkDaysAgo(exDates[exKey]);
                const isLast=i===(plant.extras.length-1);
                return e('div',{key:ex.type,style:{margin:`0 12px ${isLast?10:6}px`,background:ecfg.bg,borderRadius:10,padding:"10px 12px",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},
                  e('div',{style:{flex:1}},
                    e('div',{style:{fontSize:12,fontWeight:"bold",color:ecfg.color}},`${ecfg.icon} ${ex.label} · ${ex.dose}`),
                    e('div',{style:{fontSize:11,color:"#999",fontStyle:"italic",marginTop:2}},ex.note),
                    e('div',{style:{display:"flex",alignItems:"center",gap:5,marginTop:5}},
                      e('span',{style:{fontSize:11,fontWeight:"bold",color:exStStyle.color,background:exStStyle.color+"18",padding:"2px 9px",borderRadius:20}},exStStyle.label),
                      exDa!==null&&e('span',{style:{fontSize:11,color:"#bbb"}},`há ${exDa} dia${exDa!==1?"s":""}`)
                    )
                  ),
                  e('div',{style:{display:"flex",flexDirection:"column",gap:5,marginLeft:10}},
                    e('button',{onClick:()=>applyExtra(plant.id,ex.type),style:{background:flashEx[exKey]?"#5a9e6f":ecfg.color,color:"#fff",border:"none",borderRadius:8,padding:"7px 13px",cursor:"pointer",fontSize:12,fontFamily:"inherit",fontWeight:"bold",minWidth:82}},flashEx[exKey]?"✓ Feito!":"Aplicar"),
                    exDates[exKey]&&e('button',{onClick:()=>resetExtra(plant.id,ex.type),style:{background:"transparent",color:"#ccc",border:"1px solid #e5e0d8",borderRadius:8,padding:"3px 8px",cursor:"pointer",fontSize:10,fontFamily:"inherit"}},"Resetar")
                  )
                );
              }),

              plant.group==='skip'&&!(plant.extras?.length)&&e('div',{style:{padding:"0 16px 12px",fontSize:12,color:"#aaa",fontStyle:"italic"}},plant.note),

              plant.custom&&e('div',{style:{padding:"0 16px 12px",textAlign:"right"}},
                e('button',{onClick:()=>removeCustomPlant(plant.id),style:{background:"transparent",color:"#c0392b",border:"1px solid #f0d8d4",borderRadius:8,padding:"4px 10px",cursor:"pointer",fontSize:11,fontFamily:"inherit"}},"🗑 Remover planta")
              )
            );
          })
        )
      );
    }).filter(Boolean),

    visible.length===0&&e('div',{style:{textAlign:"center",color:"#aaa",marginTop:60,fontSize:15}},"Nenhuma planta encontrada."),
    e('div',{style:{textAlign:"center",color:"#ccc",fontSize:11,marginTop:40,paddingBottom:20}},"Dados salvos localmente no seu dispositivo 🌱")
  );
}

window.renderBokashi=function(){
  if(window._bokashiRendered)return;
  window._bokashiRendered=true;
  const root=ReactDOM.createRoot(document.getElementById('bokashi-root'));
  root.render(React.createElement(BokashiApp));
};

})();
</script>

<script>
/* ===== SAÚDE · Ortopedia, Dermatologia, Nutrição =====
   Dados (prefixo "saude_", sincroniza com a nuvem):
   - saude_orto_v1  / saude_orto_log_v1  : configuração e registro diário da ortopedia
   - saude_derm_v1  / saude_derm_log_v1  : idem dermatologia
   - saude_nutri_v1 / saude_nutri_log_v1 : idem nutrição
   Os resumos entram no relatório mensal da aba Histórico (e cada área tem o seu PDF).
*/
const SAU_ORTO_KEY='saude_orto_v1', SAU_ORTO_LOG='saude_orto_log_v1';
const SAU_DERM_KEY='saude_derm_v1', SAU_DERM_LOG='saude_derm_log_v1';
const SAU_NUT_KEY='saude_nutri_v1', SAU_NUT_LOG='saude_nutri_log_v1';
const sauE=psqEsc, sauId=psqId;

// ---------- Escalas e listas padrão (você pode editar os itens do checklist pelo app) ----------
const SAU_ORTO_SCALES=[
  {f:'d',name:'Dor (quadril / perna)',lo:'0 = nenhuma',hi:'10 = máxima'},
  {f:'m',name:'Padrão de marcha',lo:'0 = muito ruim',hi:'10 = ótimo'},
  {f:'q',name:'Mobilidade do quadril (destravar)',lo:'0 = travado',hi:'10 = solto'}
];
const SAU_BIO=[
  {f:'peso',l:'Peso (kg)'},{f:'mm',l:'Massa muscular esquelética (kg)'},{f:'mg',l:'Massa de gordura (kg)'},
  {f:'pgc',l:'% de gordura corporal'},{f:'imc',l:'IMC'},{f:'agua',l:'Água corporal total (L)'},
  {f:'vis',l:'Gordura visceral (nível)'},{f:'tmb',l:'Taxa metabólica basal (kcal)'},{f:'score',l:'Pontuação InBody'}
];
const SAU_PER={am:'Manhã',pm:'Noite'};
const SAU_FOCO={sup:'Superior',inf:'Inferior',todo:'Corpo todo'};

function sauDefOrto(){return{
  // guias de fisioterapia: done = sessões feitas, total = sessões da guia (edite se for diferente)
  guias:[{id:'g1',n:1,total:10,done:10},{id:'g2',n:2,total:10,done:10},{id:'g3',n:3,total:10,done:9}],
  sessoes:[], prox:'2026-11-23', ultConsulta:'', retorno:'',
  items:[
    {id:'fisio',t:'Exercícios da fisioterapia / de casa'},
    {id:'along',t:'Alongamento'},
    {id:'forca',t:'Fortalecimento (coxa e quadril)'},
    {id:'cami',t:'Caminhada / atividade orientada'},
    {id:'marcha',t:'Atenção ao padrão de marcha (passo e postura)'}
  ],
  medidas:[], questions:[]};}
function sauDefDerm(){return{consulta:'',retorno:'',conduta:'',produtos:[],questions:[]};}
function sauDefNut(){return{consulta:'',retorno:'',conduta:'',metas:{ag:'',pr:'',gd:''},suplementos:[],bio:[],questions:[]};}
function sauLoad(key,def){
  const s=medJSON(key,null),d=def();
  if(s==null)medSave(key,d);
  return (s&&typeof s==='object')?Object.assign(d,s):d;
}
let sauOr=sauLoad(SAU_ORTO_KEY,sauDefOrto);
let sauDm=sauLoad(SAU_DERM_KEY,sauDefDerm);
let sauNu=sauLoad(SAU_NUT_KEY,sauDefNut);
let sauOrLog=medJSON(SAU_ORTO_LOG,{});
let sauDmLog=medJSON(SAU_DERM_LOG,{});
let sauNuLog=medJSON(SAU_NUT_LOG,{});
let sauDate=medKey(new Date());
let sauTabNow='orto';

// ---------- Utilitários ----------
function sauToday(){return medKey(new Date());}
function sauYm(){return sauDate.slice(0,7);}
function sauFull(k){if(!k)return '—';const p=k.split('-');return `${p[2]}/${p[1]}/${p[0]}`;}
function sauNum(v){const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;}
function sauN(v,dec){if(v==null||v==='')return '—';const f=Math.pow(10,dec==null?1:dec);return String(Math.round(v*f)/f).replace('.',',');}
function sauSigned(v){if(v==null)return '';const s=sauN(v,1);return (v>0?'+':'')+s;}
function sauCountdown(k){
  if(!k)return 'Escolha a data.';
  const diff=Math.round((medParse(k)-medParse(sauToday()))/86400000);
  const d=medParse(k),f=`${MED_WD[d.getDay()]}, ${sauFull(k)}`;
  if(diff>1)return `Em ${diff} dias · ${f}`;
  if(diff===1)return `Amanhã · ${f}`;
  if(diff===0)return `Hoje · ${f}`;
  return `Já passou (${f}) — atualize quando marcar a próxima.`;
}
function sauByK(a,b){return a.k<b.k?-1:a.k>b.k?1:0;}
function sauIsEmpty(v){
  if(v==null||v===''||v===false)return true;
  if(typeof v==='object')return Object.keys(v).every(k=>sauIsEmpty(v[k]));
  return false;
}
function sauSaveCfg(kind){
  if(kind==='o')medSave(SAU_ORTO_KEY,sauOr);
  else if(kind==='d')medSave(SAU_DERM_KEY,sauDm);
  else medSave(SAU_NUT_KEY,sauNu);
}
function sauSaveLog(kind){
  const m={o:[sauOrLog,SAU_ORTO_LOG],d:[sauDmLog,SAU_DERM_LOG],n:[sauNuLog,SAU_NUT_LOG]}[kind];
  Object.keys(m[0]).forEach(k=>{if(sauIsEmpty(m[0][k]))delete m[0][k];});
  medSave(m[1],m[0]);
}
function sauCfg(kind){return kind==='o'?sauOr:kind==='d'?sauDm:sauNu;}
function sauLogOf(kind){return kind==='o'?sauOrLog:kind==='d'?sauDmLog:sauNuLog;}
function sauDay(kind){const L=sauLogOf(kind);return L[sauDate]||(L[sauDate]={});}
function sauVal(id,v){const el=document.getElementById(id);if(el&&document.activeElement!==el)el.value=v==null?'':v;}
function sauToggleCls(id,on){const el=document.getElementById(id);if(el)el.classList.toggle('on',!!on);}

// dias "esperados" no mês: do primeiro dia registrado até o fim do mês / hoje
function sauExpectedDays(ym,log){
  const all=Object.keys(log).sort();
  if(!all.length)return 0;
  const p=ym.split('-').map(Number),last=new Date(p[0],p[1],0).getDate(),todayK=sauToday();
  let from=ym+'-01';if(all[0]>from)from=all[0];
  let to=`${ym}-${String(last).padStart(2,'0')}`;if(todayK<to)to=todayK;
  if(from>to)return 0;
  let n=0;for(let d=medParse(from);medKey(d)<=to;d.setDate(d.getDate()+1))n++;
  return n;
}
function sauAvg(rows,f){
  const v=rows.map(r=>r[f]).filter(x=>typeof x==='number');
  return v.length?Math.round(10*v.reduce((s,x)=>s+x,0)/v.length)/10:null;
}

// ---------- Navegação ----------
function sauNavDay(dir){
  const d=medParse(sauDate);d.setDate(d.getDate()+dir);
  const k=medKey(d);if(k>sauToday())return;
  sauDate=k;sauRender();
}
function sauGoToday(){sauDate=sauToday();sauRender();}
function sauTab(t){
  sauTabNow=t;
  ['orto','derm','nutri'].forEach(x=>{
    document.getElementById('sau-pane-'+x).style.display=(x===t)?'block':'none';
    document.getElementById('sau-tab-'+x).classList.toggle('on',x===t);
  });
  window.scrollTo(0,0);
}
function sauRenderDate(){
  const today=sauToday(),d=medParse(sauDate);
  document.querySelectorAll('.sau-datelabel b').forEach(el=>{el.textContent=`${MED_WD[d.getDay()]}, ${d.getDate()} de ${MED_MON_FULL[d.getMonth()].toLowerCase()}`;});
  document.querySelectorAll('.sau-today-link').forEach(el=>{el.style.display=sauDate===today?'none':'inline';});
  document.querySelectorAll('.sau-next-day').forEach(el=>{el.disabled=sauDate>=today;});
}

// ---------- Perguntas para o médico (as 3 áreas) ----------
function sauAddQ(kind){
  const el=document.getElementById('sau-q-in-'+kind);const t=el.value.trim();if(!t)return;
  sauCfg(kind).questions.push({id:sauId(),t:t,done:false});
  el.value='';sauSaveCfg(kind);sauRender();
}
function sauToggleQ(kind,id){const q=sauCfg(kind).questions.find(x=>x.id===id);if(q){q.done=!q.done;sauSaveCfg(kind);sauRender();}}
function sauDelQ(kind,id){const c=sauCfg(kind);c.questions=c.questions.filter(x=>x.id!==id);sauSaveCfg(kind);sauRender();}
function sauQListHtml(kind){
  const qs=sauCfg(kind).questions;
  return qs.length?qs.map(q=>`<div class="sau-li"><div class="sau-item${q.done?' done':''}" style="border:none;padding:0;flex:1;" onclick="sauToggleQ('${kind}','${q.id}')"><div class="sau-box">✓</div><div class="sau-t">${sauE(q.t)}</div></div><button class="sau-x" title="Remover" onclick="sauDelQ('${kind}','${q.id}')">×</button></div>`).join('')
    :'<div class="sau-empty">Nenhuma pergunta ainda.</div>';
}
function sauQCard(kind){
  return `<div class="sau-h" style="margin-top:18px;"><span>Perguntas para o médico</span></div>
    <div id="sau-q-${kind}"></div>
    <div class="sau-row" style="margin-top:10px;"><input type="text" id="sau-q-in-${kind}" placeholder="Escreva uma dúvida para não esquecer…" onkeydown="if(event.key==='Enter')sauAddQ('${kind}')"><button class="sau-btn" onclick="sauAddQ('${kind}')">Adicionar</button></div>`;
}
function sauDateNav(){
  return `<div class="sau-datenav"><button onclick="sauNavDay(-1)" aria-label="Dia anterior">‹</button>
    <div class="sau-datelabel"><b></b><a class="sau-today-link" onclick="sauGoToday()">voltar para hoje</a></div>
    <button class="sau-next-day" onclick="sauNavDay(1)" aria-label="Próximo dia">›</button></div>`;
}
function sauScalesHtml(scales,o,handler){
  return scales.map(s=>{
    let b='';for(let i=0;i<=10;i++)b+=`<button class="${o[s.f]===i?'on':''}" onclick="${handler}('${s.f}',${i})">${i}</button>`;
    return `<div class="sau-scale"><div class="sau-scale-h"><b>${s.name}</b><span>${s.lo} · ${s.hi}</span></div><div class="sau-btns">${b}</div></div>`;
  }).join('');
}
function sauOpenRel(only){
  const ym=sauYm(),r=relSnapshot(ym);
  const key={orto:'orto',derm:'derm',nutri:'nut'}[only];
  if(!r||!r[key]){alert('Ainda não há registros neste mês para gerar o relatório. Navegue até um mês com registros ou registre algo hoje.');return;}
  relOpenPdf(ym,only);
}
function sauRelButton(only){
  return `<div class="sau-row" style="margin-top:10px;"><button class="sau-btn" onclick="sauOpenRel('${only}')">📄 Relatório do mês (PDF)</button></div>
    <div class="sau-sub">Também aparece no relatório mensal da aba Histórico.</div>`;
}

// =====================================================================
//  ORTOPEDIA
// =====================================================================
function sauGuiaAtiva(){return sauOr.guias.find(g=>g.done<g.total)||null;}
function sauGuiaNum(id){const g=sauOr.guias.find(x=>x.id===id);return g?g.n:null;}
function sauSessaoFeita(){
  const k=document.getElementById('sau-o-sdate').value||sauToday();
  let g=sauGuiaAtiva();
  if(!g){ // todas completas: abre a próxima guia
    const n=sauOr.guias.reduce((m,x)=>Math.max(m,x.n),0)+1;
    g={id:sauId(),n:n,total:10,done:0};sauOr.guias.push(g);
  }
  g.done++;
  sauOr.sessoes.push({id:sauId(),k:k,g:g.id});
  if(sauOr.prox&&k>=sauOr.prox)sauOr.prox='';   // a sessão agendada foi feita
  sauSaveCfg('o');sauRender();
}
function sauNovaGuia(){
  const n=sauOr.guias.reduce((m,x)=>Math.max(m,x.n),0)+1;
  sauOr.guias.push({id:sauId(),n:n,total:10,done:0});sauSaveCfg('o');sauRender();
}
function sauGuiaAdj(id,dir){
  const g=sauOr.guias.find(x=>x.id===id);if(!g)return;
  g.done=Math.max(0,Math.min(g.total,g.done+dir));sauSaveCfg('o');sauRender();
}
function sauGuiaTotal(id){
  const g=sauOr.guias.find(x=>x.id===id);if(!g)return;
  const v=prompt(`Quantas sessões tem a guia ${g.n}?`,g.total);
  const n=parseInt(v,10);if(!n||n<1)return;
  g.total=n;g.done=Math.min(g.done,n);sauSaveCfg('o');sauRender();
}
function sauDelSessao(id){
  const s=sauOr.sessoes.find(x=>x.id===id);if(!s)return;
  const g=sauOr.guias.find(x=>x.id===s.g);if(g)g.done=Math.max(0,g.done-1);
  sauOr.sessoes=sauOr.sessoes.filter(x=>x.id!==id);sauSaveCfg('o');sauRender();
}
function sauOrSet(f,v){sauOr[f]=v||'';sauSaveCfg('o');sauRender();}
function sauAddMed(){
  const k=document.getElementById('sau-o-mdate').value||sauToday();
  const cm=sauNum(document.getElementById('sau-o-mcm').value);
  const lado=document.getElementById('sau-o-mlado').value;
  if(cm==null)return;
  sauOr.medidas.push({id:sauId(),k:k,cm:cm,lado:lado});
  document.getElementById('sau-o-mcm').value='';
  sauSaveCfg('o');sauRender();
}
function sauDelMed(id){sauOr.medidas=sauOr.medidas.filter(m=>m.id!==id);sauSaveCfg('o');sauRender();}
function sauMedResumo(){
  const out=[];
  [['D','direita'],['E','esquerda']].forEach(p=>{
    const L=sauOr.medidas.filter(m=>m.lado===p[0]).sort(sauByK);
    if(!L.length)return;
    const last=L[L.length-1],prev=L.length>1?L[L.length-2]:null,first=L[0];
    out.push({lado:p[1],last:last,dPrev:prev?Math.round((last.cm-prev.cm)*10)/10:null,dFirst:L.length>1?Math.round((last.cm-first.cm)*10)/10:null,first:first});
  });
  return out;
}

function sauOrtoStats(ym,closed){
  const days=Object.keys(sauOrLog).filter(k=>k.startsWith(ym+'-')).sort();
  const ses=sauOr.sessoes.filter(s=>s.k.startsWith(ym+'-')).sort(sauByK);
  const med=sauOr.medidas.filter(m=>m.k.startsWith(ym+'-')).sort(sauByK);
  const cons=!!(sauOr.ultConsulta&&sauOr.ultConsulta.startsWith(ym+'-'));
  if(!days.length&&!ses.length&&!med.length&&!cons)return null;
  const exp=sauExpectedDays(ym,sauOrLog);
  const rows=days.map(k=>{const o=sauOrLog[k];return{k:k,d:o.d,m:o.m,q:o.q,c:Object.keys(o.c||{}).length,n:(o.n||'').trim()};});
  const items=sauOr.items.map(it=>({t:it.t,n:days.filter(k=>sauOrLog[k].c&&sauOrLog[k].c[it.id]).length}));
  const tot=items.reduce((s,x)=>s+x.n,0);
  const ult={};
  [['D','direita'],['E','esquerda']].forEach(p=>{
    const L=sauOr.medidas.filter(m=>m.lado===p[0]&&m.k<=ym+'-31').sort(sauByK);
    if(!L.length)return;
    const last=L[L.length-1],prev=L.length>1?L[L.length-2]:null,first=L[0];
    ult[p[1]]={k:last.k,cm:last.cm,dPrev:prev?Math.round((last.cm-prev.cm)*10)/10:null,dFirst:L.length>1?Math.round((last.cm-first.cm)*10)/10:null,firstK:first.k};
  });
  const r={ym:ym,sessoes:ses.length,sesRows:ses.map(s=>({k:s.k,g:sauGuiaNum(s.g)})),
    medidas:med.map(m=>({k:m.k,cm:m.cm,lado:m.lado==='D'?'direita':'esquerda'})),ult:ult,
    exp:exp,daysLogged:days.length,dor:sauAvg(rows,'d'),marcha:sauAvg(rows,'m'),mob:sauAvg(rows,'q'),
    items:items,itemsPct:(exp&&items.length)?Math.round(100*tot/(exp*items.length)):null,rows:rows,
    consulta:cons?sauOr.ultConsulta:null};
  if(!closed){ // só fazem sentido no mês atual
    r.guias=sauOr.guias.map(g=>({n:g.n,done:g.done,total:g.total}));
    r.prox=sauOr.prox;r.retorno=sauOr.retorno;
    r.perguntas=sauOr.questions.filter(q=>!q.done).map(q=>q.t);
  }
  return r;
}

function sauDermStats(ym,closed){
  const days=Object.keys(sauDmLog).filter(k=>k.startsWith(ym+'-')).sort();
  const cons=!!(sauDm.consulta&&sauDm.consulta.startsWith(ym+'-'));
  if(!days.length&&!cons)return null;
  const exp=sauExpectedDays(ym,sauDmLog);
  const prods=sauDm.produtos.map(p=>{
    let used=0;
    days.forEach(k=>{const c=sauDmLog[k].p||{};p.per.forEach(x=>{if(c[p.id+':'+x])used++;});});
    const expected=Math.ceil(exp*(p.vezes/7)*p.per.length);
    return{nome:p.nome,como:p.como,per:p.per.map(x=>SAU_PER[x]).join(' e '),vezes:p.vezes,used:used,expected:expected,pct:expected?Math.min(100,Math.round(100*used/expected)):null};
  });
  const r={ym:ym,exp:exp,daysLogged:days.length,prods:prods,
    rows:days.map(k=>({k:k,n:(sauDmLog[k].n||'').trim(),usos:Object.keys(sauDmLog[k].p||{}).length})),
    consulta:(cons||!closed)?sauDm.consulta:null,conduta:(cons||!closed)?(sauDm.conduta||'').trim():''};
  if(!closed){r.retorno=sauDm.retorno;r.perguntas=sauDm.questions.filter(q=>!q.done).map(q=>q.t);}
  return r;
}

  if(!days.length&&!bio.length&&!cons)return null;
  const exp=sauExpectedDays(ym,sauNuLog);
  const rows=days.map(k=>{const o=sauNuLog[k],a=o.a||{};return{k:k,ag:o.ag,pr:o.pr,gd:o.gd,sup:Object.keys(o.s||{}).length,at:a.t||'',min:a.min,foco:a.foco?SAU_FOCO[a.foco]:'',n:(o.n||'').trim()};});
  const m=sauNu.metas;
  const metDays=(f,meta)=>meta?rows.filter(r=>typeof r[f]==='number'&&r[f]>=meta).length:null;
  const sups=sauNu.suplementos.map(s=>({nome:s.nome,dose:s.dose,n:days.filter(k=>sauNuLog[k].s&&sauNuLog[k].s[s.id]).length}));
  const comAt=rows.filter(r=>r.foco||r.at||r.min);
  const foco={sup:0,inf:0,todo:0};
  days.forEach(k=>{const a=sauNuLog[k].a;if(a&&a.foco)foco[a.foco]++;});
  const lastBio=sauNu.bio.filter(b=>b.k<=ym+'-31').sort(sauByK);
  const r={ym:ym,exp:exp,daysLogged:days.length,metas:{ag:m.ag,pr:m.pr,gd:m.gd},
    ag:sauAvg(rows,'ag'),pr:sauAvg(rows,'pr'),gd:sauAvg(rows,'gd'),
    agMet:metDays('ag',m.ag),prMet:metDays('pr',m.pr),agN:rows.filter(x=>typeof x.ag==='number').length,prN:rows.filter(x=>typeof x.pr==='number').length,
    sups:sups,atDias:comAt.length,atMin:comAt.reduce((s,x)=>s+(x.min||0),0),foco:{sup:foco.sup,inf:foco.inf,todo:foco.todo},
    bio:bio.map(b=>Object.assign({},b)),bioPrev:(bio.length&&lastBio.length>bio.length)?lastBio[lastBio.length-bio.length-1]:null,
    rows:rows,consulta:(cons||!closed)?sauNu.consulta:null,conduta:(cons||!closed)?(sauNu.conduta||'').trim():''};
  if(!closed){r.retorno=sauNu.retorno;r.perguntas=sauNu.questions.filter(q=>!q.done).map(q=>q.t);}
  return r;
}

// meses que têm algum registro de saúde (usado pelo Histórico)
function sauMonthsWithData(){
  const set={};
  [sauOrLog,sauDmLog,sauNuLog].forEach(L=>Object.keys(L).forEach(k=>{set[k.slice(0,7)]=1;}));
  sauOr.sessoes.forEach(s=>{set[s.k.slice(0,7)]=1;});
  sauOr.medidas.forEach(m=>{set[m.k.slice(0,7)]=1;});
  sauNu.bio.forEach(b=>{set[b.k.slice(0,7)]=1;});
  [sauOr.ultConsulta,sauDm.consulta,sauNu.consulta].forEach(k=>{if(k)set[k.slice(0,7)]=1;});
  return Object.keys(set);
}

<script>
/* ===== HISTÓRICO E RELATÓRIO MENSAL ===== */
const HIST_KEY = 'painel_dores_historico_v1';      // registros antigos (só dores)
const REL_KEY  = 'painel_dores_relatorios_v2';     // relatórios mensais completos { "2026-10": {...} }

function histLoad(){
  try{return JSON.parse(localStorage.getItem(HIST_KEY)||'[]');}catch(e){return[];}
}
function histSave(arr){
  try{localStorage.setItem(HIST_KEY,JSON.stringify(arr));}catch(e){}
}

// Calcula resumo a partir de um objeto de dados de dores
function histCalcSummary(data){
  if(!data||!data.days)return null;
  let daysWithPain=0,totalInt=0,rescueCount=0,worstDay=0,worstInt=0;
  Object.entries(data.days).forEach(([day,rd])=>{
    if(rd.int>0){
      daysWithPain++;totalInt+=rd.int;
      if(rd.int>worstInt){worstInt=rd.int;worstDay=parseInt(day);}
    }
    if(rd.resc&&rd.resc.trim())rescueCount++;
  });
  return{
    month:data.month||'',
    daysWithPain,
    rescueCount,
    avgInt:daysWithPain>0?(totalInt/daysWithPain).toFixed(1):'—',
    worstDay:worstDay>0?`Dia ${String(worstDay).padStart(2,'0')}`:'—',
    worstInt:worstInt>0?worstInt:'—'
  };
}

// (antigo) Salva o mês visível da aba Dores no histórico simples. Continua sendo
// chamado ao navegar entre meses na aba Dores.
function histArchiveCurrentMonth(){
  const data=dorLoadLocal();
  if(!data||!data.days||Object.keys(data.days).length===0)return;
  const summary=histCalcSummary(data);
  if(!summary||summary.daysWithPain===0)return;
  const hist=histLoad();
  const key=data.month||'sem título';
  const exists=hist.findIndex(h=>h.month===key);
  if(exists>=0)hist[exists]=summary;
  else hist.unshift(summary);
  histSave(hist);
}

/* ---------- Relatório mensal (dores + medicações + psiquiatria) ---------- */
function relLabel(ym){const p=ym.split('-').map(Number);return `${MED_MON_FULL[p[1]-1]} / ${p[0]}`;}
function relCur(){return medKey(new Date()).slice(0,7);}
function relNum(v){return v==null?'—':String(v).replace('.',',');}

// Monta o relatório de um mês a partir dos dados brutos de cada aba.
function relBuild(ym){
  const closed=ym<relCur();
  let pain=null;
  const data=medJSON('painel_dores_'+ym,null);
  if(data&&data.days){
    const s=histCalcSummary(data);
    if(s&&s.daysWithPain>0){
      pain={
        daysWithPain:s.daysWithPain,rescueCount:s.rescueCount,avgInt:s.avgInt,worstDay:s.worstDay,worstInt:s.worstInt,
        rows:Object.keys(data.days).map(Number).sort((a,b)=>a-b).map(d=>{
          const r=data.days[d];return{d:d,int:r.int||0,loc:r.loc||'',sym:r.sym||'',resc:r.resc||'',notes:r.notes||''};
        })
      };
    }
  }
  const meds=medMonthStats(ym);
  const psiq=psqMonthStats(ym);
  if(psiq&&closed){delete psiq.perguntas;delete psiq.psico;}   // pendências só fazem sentido no mês atual
  const orto=sauOrtoStats(ym,closed),derm=sauDermStats(ym,closed),nut=sauNutStats(ym,closed);
  if(!pain&&!meds&&!psiq&&!orto&&!derm&&!nut)return null;
  return{ym:ym,label:relLabel(ym),pain:pain,meds:meds,psiq:psiq,orto:orto,derm:derm,nut:nut};
}

function relMonthsWithData(){
  const set={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);const m=/^painel_dores_(\d{4}-\d{2})$/.exec(k||'');
    if(m)set[m[1]]=1;
  }
  Object.keys(medLog).forEach(k=>{set[k.slice(0,7)]=1;});
  Object.keys(psqLog).forEach(k=>{set[k.slice(0,7)]=1;});
  psqEfx.forEach(e=>{set[e.k.slice(0,7)]=1;});
  sauMonthsWithData().forEach(k=>{set[k]=1;});
  return Object.keys(set).sort().reverse();
}

// Roda ao abrir o app: guarda o relatório de todo mês que já fechou.
function relAutoArchive(){
  const cur=relCur();
  const arch=medJSON(REL_KEY,{});
  let changed=false;
  relMonthsWithData().forEach(ym=>{
    if(ym>=cur)return;
    const snap=relBuild(ym);
    if(!snap)return;
    const old=arch[ym];
    snap.archivedAt=old&&old.archivedAt?old.archivedAt:new Date().toISOString();
    const a=JSON.stringify(Object.assign({},snap,{archivedAt:0}));
    const b=old?JSON.stringify(Object.assign({},old,{archivedAt:0})):'';
    if(a!==b){arch[ym]=snap;changed=true;}
  });
  if(changed)medSave(REL_KEY,arch);
}

// Relatório que será exibido: mês fechado = arquivado; mês atual = ao vivo.
function relSnapshot(ym){
  if(ym>=relCur())return relBuild(ym);
  const arch=medJSON(REL_KEY,{});
  return arch[ym]||relBuild(ym);
}

function relCardHtml(r,live){
  const p=r.pain,m=r.meds,q=r.psiq;
  const pHtml=p?`<div class="rel-grid"><div><b>${p.daysWithPain}</b><span>Dias c/ dor</span></div><div><b>${p.rescueCount}</b><span>Resgates</span></div><div><b>${relNum(p.avgInt)}</b><span>Int. média</span></div><div><b>${p.worstInt}</b><span>Pior (${String(p.worstDay).replace('Dia ','dia ')})</span></div></div>`
    :'<div class="rel-none">Sem registros de dor neste mês.</div>';
  let mHtml='<div class="rel-none">Sem registros de medicação neste mês.</div>';
  if(m){
    const dose=m.doseAtStart?`${m.doseAtStart} mg`:'';
    const ch=m.doseChanges.map((c,i)=>(dose||i?' → ':'')+`${c.mg} mg a partir de ${medFmt(c.from)}`).join('');
    mHtml=`<div class="rel-grid three"><div><b>${m.pct}%</b><span>Adesão geral</span></div><div><b>${m.full}/${m.expected}</b><span>Dias completos</span></div><div><b>${m.per.riva}/${m.expected}</b><span>Rivaroxabana</span></div></div>
      <div class="rel-line" style="margin-top:6px;">Desvenlafaxina: ${m.per.desven}/${m.expected} dias (${dose||ch?'dose '+dose+ch:'dose não registrada'}) · Lamotrigina: ${m.per.lamoAm+m.per.lamoPm}/${m.expected*2} doses</div>`;
  }
  let qHtml='<div class="rel-none">Sem registros de psiquiatria neste mês.</div>';
  if(q){
    qHtml=`<div class="rel-grid"><div><b>${relNum(q.humor)}</b><span>Humor médio</span></div><div><b>${relNum(q.ansiedade)}</b><span>Ansiedade média</span></div><div><b>${relNum(q.sono)}</b><span>Sono médio</span></div><div><b>${q.orientPct==null?'—':q.orientPct+'%'}</b><span>Orientações</span></div></div>
      <div class="rel-line" style="margin-top:6px;">${q.daysLogged} dia(s) com registro · ${q.efeitos.length} anotação(ões) de efeitos da medicação</div>`;
  }
  const sec=(t,body,only)=>`<div class="rel-sec"><div class="rel-sec-t">${t}${body?` <button class="rel-pdf" style="padding:2px 8px;font-size:.56rem;margin-left:6px;" onclick="relOpenPdf('${r.ym}','${only}')">PDF</button>`:''}</div>${body||'<div class="rel-none">Sem registros neste mês.</div>'}</div>`;
  return `<div class="rel-card">
    <div class="rel-card-h"><div><b>${r.label}</b><span class="rel-chip ${live?'live':'closed'}">${live?'em andamento':'fechado'}</span></div>
      <button class="rel-pdf" onclick="relOpenPdf('${r.ym}')">📄 PDF</button></div>
    <div class="rel-sec"><div class="rel-sec-t">Dores</div>${pHtml}</div>
    <div class="rel-sec"><div class="rel-sec-t">Medicações</div>${mHtml}</div>
    <div class="rel-sec"><div class="rel-sec-t">Psiquiatria</div>${qHtml}</div>
    ${sec('Ortopedia',r.orto?sauOrtoCard(r.orto):'','orto')}
    ${sec('Dermatologia',r.derm?sauDermCard(r.derm):'','derm')}
    ${sec('Nutrição',r.nut?sauNutCard(r.nut):'','nutri')}
  </div>`;
}

/* ---------- PDF (tela de impressão do próprio navegador) ---------- */
function relPdfHtml(r,only){
  const E=psqEsc;
  const show=s=>!only||only===s;
  const today=new Date();
  const gen=`${String(today.getDate()).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}/${today.getFullYear()}`;
  const fk=k=>medFmt(k);
  let h=`<h1>Relatório de acompanhamento${only?' · '+({orto:'Ortopedia',derm:'Dermatologia',nutri:'Nutrição'}[only]||''):''}</h1>
    <div class="sub">${r.label}${r.ym>=relCur()?' (parcial — mês em andamento)':''} · gerado em ${gen}</div>
    <div class="disc">Registro pessoal feito por Bruna no painel de acompanhamento, para apoiar a conversa na consulta. Não substitui avaliação médica.</div>`;

  if(show('meds')){
  h+='<h2>Medicações</h2>';
  if(r.meds){
    const m=r.meds;
    const dose=m.doseAtStart?`${m.doseAtStart} mg/dia`:'';
    const ch=m.doseChanges.map((c,i)=>(dose||i?'; ':'')+`${c.mg} mg/dia a partir de ${fk(c.from)}`).join('');
    const doseTxt=(dose+ch)||'dose não registrada';
    const pc=(n,d)=>d?Math.round(100*n/d)+'%':'—';
    h+=`<div class="kv"><div><b>${m.pct}%</b><span>Adesão geral</span></div><div><b>${m.full} de ${m.expected}</b><span>Dias com tudo tomado</span></div></div>
    <table><tr><th>Medicamento</th><th>Posologia</th><th class="c">Tomadas</th><th class="c">%</th></tr>
    <tr><td>Desvenlafaxina</td><td>${doseTxt}, 1x ao dia após refeição</td><td class="c">${m.per.desven} de ${m.expected} dias</td><td class="c">${pc(m.per.desven,m.expected)}</td></tr>
    <tr><td>Lamotrigina</td><td>50 mg, 12/12h (100 mg/dia)</td><td class="c">${m.per.lamoAm+m.per.lamoPm} de ${m.expected*2} doses</td><td class="c">${pc(m.per.lamoAm+m.per.lamoPm,m.expected*2)}</td></tr>
    <tr><td>Rivaroxabana</td><td>20 mg, após o almoço</td><td class="c">${m.per.riva} de ${m.expected} dias</td><td class="c">${pc(m.per.riva,m.expected)}</td></tr></table>
    <div class="sub">Contagem a partir de ${fk(m.from)} até ${fk(m.to)}.</div>`;
  }else h+='<div class="sub">Sem registros neste mês.</div>';

  }
  if(show('pain')){
  h+='<h2>Dores</h2>';
  if(r.pain){
    const p=r.pain;
    h+=`<div class="kv"><div><b>${p.daysWithPain}</b><span>Dias com dor</span></div><div><b>${p.rescueCount}</b><span>Resgates</span></div><div><b>${relNum(p.avgInt)}</b><span>Intensidade média</span></div><div><b>${p.worstInt}</b><span>Pior (${String(p.worstDay).replace('Dia ','dia ')})</span></div></div>
    <table><tr><th>Dia</th><th class="c">Int.</th><th>Local</th><th>Sintomas</th><th>Resgate</th><th>Observações</th></tr>
    ${p.rows.map(x=>`<tr><td>${String(x.d).padStart(2,'0')}</td><td class="c">${x.int||''}</td><td>${E(x.loc)}</td><td>${E(x.sym)}</td><td>${E(x.resc)}</td><td>${E(x.notes)}</td></tr>`).join('')}</table>`;
  }else h+='<div class="sub">Sem registros neste mês.</div>';

  }
  if(show('psiq')){
  h+='<h2>Psiquiatria</h2>';
  if(r.psiq){
    const q=r.psiq;
    h+=`<div class="kv"><div><b>${relNum(q.humor)}</b><span>Humor médio (0–10)</span></div><div><b>${relNum(q.ansiedade)}</b><span>Ansiedade média (0–10)</span></div><div><b>${relNum(q.sono)}</b><span>Sono médio (0–10)</span></div><div><b>${q.daysLogged}</b><span>Dias com registro</span></div></div>
    <div class="sub">Humor: 0 = muito mal, 10 = muito bem · Ansiedade: 0 = nenhuma, 10 = máxima · Sono: 0 = péssimo, 10 = ótimo.</div>
    <h3>Orientações da consulta de 23/10/2026 (dias cumpridos)</h3>
    <table><tr><th>Orientação</th><th class="c">Dias</th></tr>
    ${PSQ_ORIENT.map(o=>`<tr><td>${o.t}</td><td class="c">${q.orient[o.id]} de ${q.expected}</td></tr>`).join('')}</table>`;
    if(q.rows.length){
      h+=`<h3>Registro diário</h3><table><tr><th>Dia</th><th class="c">Humor</th><th class="c">Ansiedade</th><th class="c">Sono</th><th class="c">Orient.</th><th>Anotação</th></tr>
      ${q.rows.map(x=>`<tr><td>${fk(x.k)}</td><td class="c">${x.h==null?'':x.h}</td><td class="c">${x.a==null?'':x.a}</td><td class="c">${x.s==null?'':x.s}</td><td class="c">${x.c}/${PSQ_ORIENT.length}</td><td>${E(x.n)}</td></tr>`).join('')}</table>`;
    }
    h+='<h3>Efeitos da medicação (anotações livres)</h3>';
    h+=q.efeitos.length?'<ul>'+q.efeitos.map(e=>`<li><b>${fk(e.k)}</b> — ${E(e.t)}</li>`).join('')+'</ul>':'<div class="sub">Nenhuma anotação neste mês.</div>';
    if(q.perguntas){
      const open=q.perguntas.filter(x=>!x.done);
      h+='<h3>Perguntas para a próxima consulta</h3>';
      h+=open.length?'<ul>'+open.map(x=>`<li>${E(x.t)}</li>`).join('')+'</ul>':'<div class="sub">Nenhuma pergunta pendente.</div>';
    }
    if(q.psico){
      h+=`<h3>Psicoterapia</h3><div class="sub">${q.psico.done?'Retomada':'Ainda não retomada'}${q.psico.when?' · '+E(q.psico.when):''}</div>`;
    }
  }else h+='<div class="sub">Sem registros neste mês.</div>';
  }
  if(show('orto'))h+=sauPdfOrto(r.orto);
  if(show('derm'))h+=sauPdfDerm(r.derm);
  if(show('nutri'))h+=sauPdfNut(r.nut);
  return h;
}

function relOpenPdf(ym,only){
  const r=relSnapshot(ym);
  if(!r)return;
  relClose();
  const ov=document.createElement('div');
  ov.id='rel-overlay';
  ov.innerHTML=`<div class="rel-toolbar"><button class="rel-tb-btn" onclick="window.print()">🖨 Imprimir / salvar como PDF</button><button class="rel-tb-btn ghost" onclick="relClose()">Fechar</button></div><div class="rel-doc">${relPdfHtml(r,only)}</div>`;
  document.body.appendChild(ov);
  document.body.classList.add('rel-open');
  ov.scrollTop=0;
}
function relClose(){
  const ov=document.getElementById('rel-overlay');
  if(ov)ov.remove();
  document.body.classList.remove('rel-open');
}

/* ---------- Tela do Histórico ---------- */
function histRender(){
  const cur=relCur();
  relAutoArchive();
  const arch=medJSON(REL_KEY,{});
  const months={};
  Object.keys(arch).forEach(k=>{months[k]=1;});
  relMonthsWithData().forEach(k=>{if(k<=cur)months[k]=1;});
  const list=Object.keys(months).sort().reverse();

  const cards=document.getElementById('hist-cards');
  cards.innerHTML='';
  let shown=0;
  const shownLabels={};
  list.forEach(ym=>{
    const r=relSnapshot(ym);
    if(!r)return;
    cards.insertAdjacentHTML('beforeend',relCardHtml(r,ym>=cur));
    shownLabels[r.label]=1;shown++;
  });

  // Registros antigos (só dores) que ainda não têm cartão equivalente
  const legacy=histLoad().filter(h=>!shownLabels[h.month]);
  const wrap=document.getElementById('hist-legacy-wrap');
  const tbody=document.getElementById('hist-tbody');
  tbody.innerHTML='';
  legacy.forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.style.cssText=`border-bottom:1px solid #ddd8d0;${i%2===0?'background:white;':'background:#f8f5f0;'}`;
    const intColor=r.worstInt>=8?'#c0392b':r.worstInt>=5?'#e67e22':r.worstInt>=3?'#f1c40f':'#27ae60';
    tr.innerHTML=`
      <td style="padding:.6rem .6rem;font-weight:600;color:#2c2c2c;">${psqEsc(r.month||'—')}</td>
      <td style="padding:.6rem .6rem;text-align:center;color:#1a3a5c;font-weight:600;">${r.daysWithPain}</td>
      <td style="padding:.6rem .6rem;text-align:center;color:#c9a87c;font-weight:600;">${r.rescueCount}</td>
      <td style="padding:.6rem .6rem;text-align:center;color:#5a4a3a;">${r.avgInt}</td>
      <td style="padding:.6rem .6rem;text-align:center;color:#5a4a3a;">${r.worstDay}</td>
      <td style="padding:.6rem .6rem;text-align:center;font-weight:700;color:${intColor};">${r.worstInt}</td>`;
    tbody.appendChild(tr);
  });
  wrap.style.display=legacy.length?'block':'none';
  document.getElementById('hist-empty').style.display=(shown||legacy.length)?'none':'block';
  document.getElementById('hist-note').style.display=shown?'block':'none';
}

// Arquiva ao abrir o app e sempre que a janela voltar a ficar visível
// (cobre o caso de o app ficar aberto na virada do mês).
let relLastMonth=relCur();
relAutoArchive();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  const m=relCur();
  if(m!==relLastMonth){relLastMonth=m;relAutoArchive();}
});
</script>

<script>
let __authMode = 'login';
document.getElementById('__tabLogin').onclick = ()=>{
  __authMode='login';
  document.getElementById('__tabLogin').style.background='#1F4038';document.getElementById('__tabLogin').style.color='#fff';
  document.getElementById('__tabSignup').style.background='#EAEDE9';document.getElementById('__tabSignup').style.color='#6B7A73';
  document.getElementById('__authSubmit').textContent='Entrar';
  document.getElementById('__authError').style.display='none';
};
document.getElementById('__tabSignup').onclick = ()=>{
  __authMode='signup';
  document.getElementById('__tabSignup').style.background='#1F4038';document.getElementById('__tabSignup').style.color='#fff';
  document.getElementById('__tabLogin').style.background='#EAEDE9';document.getElementById('__tabLogin').style.color='#6B7A73';
  document.getElementById('__authSubmit').textContent='Criar conta';
  document.getElementById('__authError').style.display='none';
};
function __authErrorMsg(code){
  const map = {
    'auth/invalid-email':'E-mail inválido.',
    'auth/user-not-found':'Não existe conta com esse e-mail.',
    'auth/wrong-password':'Senha incorreta.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/email-already-in-use':'Já existe uma conta com esse e-mail. Toque em "Entrar".',
    'auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.',
    'auth/network-request-failed':'Sem conexão com a internet.'
  };
  return map[code] || ('Não foi possível continuar (código: ' + (code||'desconhecido') + ').');
}
document.getElementById('__authSubmit').onclick = async ()=>{
  const email = document.getElementById('__authEmail').value.trim();
  const pass = document.getElementById('__authPass').value;
  const errEl = document.getElementById('__authError');
  errEl.style.display='none';
  if(!email || !pass){ errEl.textContent='Preencha e-mail e senha.'; errEl.style.display='block'; return; }
  try{
    if(__authMode==='signup') await __auth.createUserWithEmailAndPassword(email, pass);
    else await __auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    errEl.textContent = __authErrorMsg(e.code);
    errEl.style.display='block';
  }
};
document.getElementById('__logoutBtn').onclick = ()=>{ __auth.signOut(); location.reload(); };

let __booted = false;
__auth.onAuthStateChanged(async user=>{
  if(user){
    __currentUser = user;
    await __hydrateFromCloud();
    document.getElementById('__authOverlay').style.display='none';
    document.getElementById('__logoutBtn').style.display='block';
    if(!__booted){ __booted = true; __bootApp(); }
  } else {
    __currentUser = null;
    document.getElementById('__authOverlay').style.display='flex';
    document.getElementById('__logoutBtn').style.display='none';
  }
});
</script>
