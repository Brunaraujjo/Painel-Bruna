<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Painel Bruna</title>

<!-- PWA: aparece como app na tela inicial -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Painel">
<meta name="application-name" content="Painel Bruna">
<meta name="theme-color" content="#1a1410">
<meta name="description" content="Painel pessoal — medicações, psiquiatria, saúde (ortopedia, dermatologia, nutrição), dores e mais.">

<!-- PWA: manifest e ícones são arquivos reais na mesma pasta (necessário para o Chrome instalar como app) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">

<!-- Service Worker (arquivo sw.js real) -->
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW:', e); });
  });
}
</script>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&amp;family=DM+Sans:wght@300;400;500&amp;family=DM+Serif+Display:ital@0;1&amp;family=DM+Mono:wght@300;400;500&amp;family=Playfair+Display:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --nav-bg:#1a1410;
  --nav-border:#2e2416;
  --tab-active:#c9a87c;
  --tab-text:#8c7a6a;
  --page-bg:#faf6f1;
}
body{
  background:var(--page-bg);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  padding-bottom:80px;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;left:0;right:0;
  background:var(--nav-bg);
  border-top:1px solid var(--nav-border);
  display:flex;
  z-index:100;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav-btn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:10px 4px 12px;
  background:none;
  border:none;
  cursor:pointer;
  transition:all 0.2s;
}
.nav-icon{font-size:20px;line-height:1;}
.nav-label{
  font-family:'DM Sans',sans-serif;
  font-size:9px;
  font-weight:500;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--tab-text);
  transition:color 0.2s;
}
.nav-btn.active .nav-label{color:var(--tab-active);}
.nav-btn.active .nav-icon{filter:drop-shadow(0 0 6px rgba(201,168,124,0.5));}

/* ===== PAGES ===== */
.page{display:none;}
.page.active{display:block;}

/* ===== PAGE HEADER SHARED ===== */
.page-header-bar{
  text-align:center;
  padding:28px 16px 20px;
  border-bottom:1px solid #ede5df;
  margin-bottom:0;
}
.page-header-bar h2{
  font-family:'Cormorant Garamond',serif;
  font-size:1.7rem;
  font-weight:300;
  color:#3d2b24;
  letter-spacing:0.03em;
}
.page-header-bar p{
  font-size:0.72rem;
  color:#8c6e65;
  margin-top:4px;
  letter-spacing:0.12em;
  text-transform:uppercase;
}

/* ===========================
   PAGE 1 — MEDICAMENTOS (dark)
   =========================== */
#page-med{
  background:#0f0e17;
  min-height:100vh;
  padding-bottom:80px;
  background-image:radial-gradient(ellipse at 20% 10%,rgba(180,142,244,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(126,216,200,.06) 0%,transparent 50%);
}
/* all med styles from original, namespaced via #page-med */
#page-med .med-inner{color:#e8e4f7;}
#page-med header{text-align:center;margin-bottom:32px;padding-top:28px;}
#page-med header h1{font-family:'DM Serif Display',serif;font-size:1.8rem;color:#e8e4f7;letter-spacing:-.02em;line-height:1.2;}
#page-med header h1 em{font-style:italic;color:#b48ef4;}
#page-med header p{font-size:.8rem;color:#8b85a8;margin-top:6px;font-weight:300;letter-spacing:.05em;text-transform:uppercase;}
.med-legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:28px;padding:0 16px;}
.med-legend-item{display:flex;align-items:center;gap:6px;font-size:.72rem;color:#8b85a8;font-weight:500;letter-spacing:.03em;}
.med-legend-dot{width:10px;height:10px;border-radius:50%;}
.med-phase{background:#1a1929;border:1px solid #2e2a45;border-radius:16px;margin-bottom:16px;overflow:hidden;transition:border-color .2s;}
.med-phase.active{border-color:#b48ef4;box-shadow:0 0 0 1px rgba(180,142,244,.2),0 4px 24px rgba(180,142,244,.08);}
.med-phase-header{padding:16px 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;cursor:pointer;user-select:none;}
.med-phase-header-left{flex:1;}
.med-phase-tag{font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#b48ef4;margin-bottom:4px;}
.med-phase-title{font-family:'DM Serif Display',serif;font-size:1.1rem;color:#e8e4f7;line-height:1.3;}
.med-phase-dates{font-size:.75rem;color:#8b85a8;margin-top:3px;font-weight:300;}
.med-phase-progress{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:52px;}
.med-progress-circle{width:44px;height:44px;position:relative;}
.med-progress-circle svg{width:44px;height:44px;transform:rotate(-90deg);}
.med-progress-circle .bg{fill:none;stroke:#2e2a45;stroke-width:3;}
.med-progress-circle .fill{fill:none;stroke:#b48ef4;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .4s ease;}
.med-progress-circle .fill.done{stroke:#4caf8a;}
.med-progress-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.65rem;font-weight:600;color:#e8e4f7;}
.med-meds-summary{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 14px;}
.med-pill{font-size:.68rem;font-weight:500;padding:3px 10px;border-radius:20px;letter-spacing:.02em;}
.med-pill.lamo{background:rgba(180,142,244,.15);color:#b48ef4;}
.med-pill.topi{background:rgba(126,216,200,.15);color:#7ed8c8;}
.med-pill.mios{background:rgba(244,169,106,.15);color:#f4a96a;}
.med-days-grid{padding:4px 16px 20px;display:none;}
.med-phase.open .med-days-grid{display:block;}
.med-days-grid-inner{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.med-day-cell{aspect-ratio:1;border-radius:8px;background:#231f35;border:1px solid #2e2a45;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;position:relative;gap:2px;}
.med-day-cell:active{transform:scale(.95);}
.med-day-cell.checked{background:rgba(76,175,138,.15);border-color:#4caf8a;}
.med-day-cell.today{border-color:#b48ef4;background:rgba(180,142,244,.12);}
.med-day-cell.today.checked{border-color:#4caf8a;background:rgba(76,175,138,.2);}
.med-day-cell.past:not(.checked){opacity:.45;}
.med-day-num{font-size:.72rem;font-weight:600;color:#e8e4f7;line-height:1;}
.med-day-weekday{font-size:.55rem;color:#8b85a8;text-transform:uppercase;letter-spacing:.05em;}
.med-day-check{font-size:.85rem;line-height:1;}
.med-dose-dots{display:flex;gap:2px;margin-top:1px;}
.med-dose-dot{width:4px;height:4px;border-radius:50%;opacity:.7;}
.med-phase-note{margin:0 16px 16px;padding:10px 14px;background:rgba(244,169,106,.07);border-left:2px solid #f4a96a;border-radius:0 8px 8px 0;font-size:.72rem;color:#8b85a8;line-height:1.5;display:none;}
.med-phase.open .med-phase-note{display:block;}
.med-toggle-arrow{color:#8b85a8;font-size:.9rem;transition:transform .2s;flex-shrink:0;margin-top:2px;}
.med-phase.open .med-toggle-arrow{transform:rotate(180deg);}
.med-summary-bar{background:#1a1929;border:1px solid #2e2a45;border-radius:16px;padding:16px 20px;margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.med-summary-stat{text-align:center;}
.med-summary-stat .num{font-family:'DM Serif Display',serif;font-size:1.5rem;color:#b48ef4;line-height:1;}
.med-summary-stat .lbl{font-size:.65rem;color:#8b85a8;text-transform:uppercase;letter-spacing:.07em;margin-top:2px;font-weight:500;}
.med-summary-divider{width:1px;height:32px;background:#2e2a45;}

/* ===========================
   PAGE 2 — DIÁRIO DE DORES
   =========================== */
#page-dor{background:#f8f5f0;min-height:100vh;padding-bottom:80px;}
#page-dor .dor-page{max-width:860px;margin:0 auto;background:#fdfcfa;overflow:hidden;}
#page-dor .dor-header{background:#1a3a5c;padding:2rem 1.5rem 1.8rem;position:relative;overflow:hidden;}
#page-dor .dor-header::after{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(255,255,255,.06);}
#page-dor .dor-header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;}
#page-dor .dor-header h1{font-family:'DM Serif Display',serif;font-size:1.5rem;color:white;font-weight:400;line-height:1.2;}
#page-dor .dor-header h1 span{display:block;font-family:'DM Mono',monospace;font-size:.72rem;font-weight:300;color:rgba(255,255,255,.5);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.4rem;}
.dor-month-box{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;}
.dor-month-box label{font-family:'DM Mono',monospace;font-size:.65rem;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase;}
.dor-month-input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:2px;color:white;font-family:'DM Mono',monospace;font-size:.9rem;padding:.4rem .7rem;width:150px;text-align:center;}
.dor-month-input:focus{outline:none;border-color:rgba(255,255,255,.4);}
.dor-header-meta{margin-top:1.2rem;display:flex;gap:1.5rem;flex-wrap:wrap;}
.dor-meta-item{display:flex;align-items:center;gap:.5rem;}
.dor-meta-item label{font-family:'DM Mono',monospace;font-size:.65rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;}
.dor-meta-item input{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);font-family:'DM Sans',sans-serif;font-size:.85rem;padding:.1rem .3rem;width:140px;}
.dor-meta-item input:focus{outline:none;border-bottom-color:rgba(255,255,255,.6);}
.dor-body{padding:1.5rem;}
.dor-legend{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem;padding:.8rem 1rem;background:#f8f5f0;border:1px solid #ddd8d0;border-radius:2px;}
.dor-legend-title{font-family:'DM Mono',monospace;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:#888;width:100%;margin-bottom:.2rem;}
.dor-legend-item{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:#2c2c2c;}
.dor-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.dor-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.8rem;margin-bottom:1.5rem;}
.dor-summary-card{background:#f8f5f0;border:1px solid #ddd8d0;border-radius:2px;padding:.8rem 1rem;}
.dor-summary-card .val{font-family:'DM Serif Display',serif;font-size:1.8rem;color:#1a3a5c;line-height:1;margin-bottom:.2rem;}
.dor-summary-card .lbl{font-family:'DM Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:#888;}
.dor-section-title{font-family:'DM Mono',monospace;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:#888;margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:1px solid #ddd8d0;}
.dor-meds-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1.5rem;}
.dor-med-item{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border:1px solid #ddd8d0;border-radius:2px;font-size:.82rem;}
.dor-med-check{width:15px;height:15px;accent-color:#1a3a5c;flex-shrink:0;}
.dor-table-wrap{overflow-x:auto;margin-bottom:1.5rem;}
table.dor-table{width:100%;border-collapse:collapse;font-size:.8rem;}
table.dor-table thead tr{background:#1a3a5c;}
table.dor-table thead th{font-family:'DM Mono',monospace;font-size:.6rem;font-weight:400;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.7);padding:.6rem .6rem;text-align:left;white-space:nowrap;}
table.dor-table thead th:first-child{width:46px;text-align:center;}
table.dor-table tbody tr{border-bottom:1px solid #ddd8d0;transition:background .15s;}
table.dor-table tbody tr:hover{background:#f8f5f0;}
table.dor-table tbody tr:nth-child(even){background:rgba(0,0,0,.015);}
table.dor-table tbody td{padding:.5rem .6rem;vertical-align:middle;}
.dor-day-num{font-family:'DM Mono',monospace;font-size:.82rem;font-weight:500;color:#1a3a5c;text-align:center;}
table.dor-table td input[type="text"],table.dor-table td select,table.dor-table td textarea{width:100%;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:.8rem;color:#2c2c2c;padding:.15rem 0;border-bottom:1px solid transparent;transition:border-color .2s;resize:none;}
table.dor-table td input[type="text"]:focus,table.dor-table td select:focus,table.dor-table td textarea:focus{outline:none;border-bottom-color:#1a3a5c;}
table.dor-table td textarea{height:32px;line-height:1.4;overflow:hidden;}
.dor-int-wrap{display:flex;gap:3px;align-items:center;}
.dor-int-btn{width:22px;height:22px;border-radius:50%;border:1.5px solid #ddd8d0;background:white;cursor:pointer;font-family:'DM Mono',monospace;font-size:.6rem;font-weight:500;color:#888;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.dor-int-btn.active-1{background:#27ae60;border-color:#27ae60;color:white;}
.dor-int-btn.active-2{background:#6abf69;border-color:#6abf69;color:white;}
.dor-int-btn.active-3{background:#f1c40f;border-color:#f1c40f;color:#333;}
.dor-int-btn.active-4{background:#f39c12;border-color:#f39c12;color:white;}
.dor-int-btn.active-5{background:#e67e22;border-color:#e67e22;color:white;}
.dor-int-btn.active-6{background:#e74c3c;border-color:#e74c3c;color:white;}
.dor-int-btn.active-7{background:#c0392b;border-color:#c0392b;color:white;}
.dor-int-btn.active-8{background:#922b21;border-color:#922b21;color:white;}
.dor-int-btn.active-9{background:#6e1010;border-color:#6e1010;color:white;}
.dor-int-btn.active-10{background:#2d0000;border-color:#2d0000;color:white;}
.dor-notes-area{width:100%;border:1px solid #ddd8d0;border-radius:2px;background:#f8f5f0;font-family:'DM Sans',sans-serif;font-size:.85rem;color:#2c2c2c;padding:.8rem 1rem;resize:vertical;min-height:70px;line-height:1.6;}
.dor-notes-area:focus{outline:none;border-color:#1a3a5c;}
.dor-print-btn{display:block;width:100%;padding:.9rem;background:#1a3a5c;color:white;border:none;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .2s;margin-top:1.5rem;}
.dor-print-btn:hover{background:#2a5080;}
.dor-footer{padding:.8rem 1.5rem;border-top:1px solid #ddd8d0;display:flex;justify-content:space-between;align-items:center;}
.dor-footer span{font-family:'DM Mono',monospace;font-size:.65rem;color:#888;letter-spacing:.06em;}

/* ===========================
   PAGE 4 — PLANTAS (React via inline script)
   =========================== */


/* ===========================
   PAGE 5 — HOME OFFICE (horas trabalhadas)
   =========================== */
#page-ho{background:#f3f6f7;min-height:100vh;padding-bottom:80px;}
#page-ho .ho-inner{max-width:520px;margin:0 auto;padding:0 16px 0;}

.ho-badge{display:inline-block;background:#1d3a3f;color:#eaf4f3;font-size:10px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:14px;}
.ho-header{text-align:center;padding:28px 0 20px;}
.ho-header h2{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:600;line-height:1.15;color:#1d3a3f;margin-bottom:6px;}
.ho-header h2 em{font-style:italic;color:#3e8e82;}
.ho-header p{font-size:13px;color:#5c7470;font-weight:300;letter-spacing:.3px;}
.ho-header-note{font-size:11px;color:#8c9b98;margin-top:8px;line-height:1.5;font-weight:300;}

.ho-rate-card{background:white;border-radius:18px;padding:16px 18px;box-shadow:0 2px 12px rgba(29,58,63,.07);margin-bottom:18px;}
.ho-rate-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ho-rate-label{font-size:10.5px;color:#5c7470;text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:4px;}
.ho-rate-value{font-family:'DM Serif Display',serif;font-size:1.3rem;color:#1d3a3f;line-height:1;}
.ho-rate-updated{font-size:10.5px;color:#8c9b98;margin-top:3px;}
.ho-rate-refresh{flex-shrink:0;background:#eaf4f3;color:#1d3a3f;border:1px solid #cfe3e1;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;}
.ho-rate-refresh:hover{background:#dcecea;}
.ho-rate-refresh:disabled{opacity:.6;cursor:default;}
.ho-rate-manual{display:flex;gap:8px;margin-top:12px;}
.ho-rate-manual input{flex:1;border:1px solid #dde6e5;border-radius:10px;padding:9px 10px;font-size:14px;font-family:'DM Sans',sans-serif;color:#1d3a3f;background:#fbfdfc;box-sizing:border-box;}
.ho-rate-manual input:focus{outline:none;border-color:#3e8e82;}
.ho-rate-manual button{background:#1d3a3f;color:#eaf4f3;border:none;border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;}
.ho-rate-manual button:hover{background:#2a4f55;}
.ho-rate-hint{font-size:11.5px;color:#c07800;margin-top:10px;line-height:1.5;display:none;}
.ho-rate-hint.visible{display:block;}
.ho-rate-hint.ok{color:#2e8b57;}

.ho-summary-row{display:flex;gap:10px;margin-bottom:18px;}
.ho-summary-card{flex:1;background:white;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 2px 12px rgba(29,58,63,.07);}
.ho-summary-label{font-size:10.5px;color:#5c7470;text-transform:uppercase;letter-spacing:.07em;font-weight:500;margin-bottom:6px;}
.ho-summary-hours{font-family:'DM Serif Display',serif;font-size:1.25rem;color:#1d3a3f;line-height:1;}
.ho-summary-value{font-size:12px;color:#3e8e82;font-weight:500;margin-top:3px;}
.ho-summary-brl{font-size:10.5px;color:#8c9b98;margin-top:1px;}
.ho-summary-range{font-size:10px;color:#8c9b98;margin-top:4px;}

.ho-form-card{background:white;border-radius:18px;padding:18px 20px;box-shadow:0 2px 12px rgba(29,58,63,.07);margin-bottom:18px;}
.ho-form-title{font-family:'Playfair Display',serif;font-size:14px;font-weight:600;color:#1d3a3f;margin-bottom:14px;}
.ho-form-row{display:flex;gap:10px;margin-bottom:14px;}
.ho-field{flex:1;}
.ho-field-sm{flex:0 0 72px;}
.ho-field label{display:block;font-size:10.5px;color:#5c7470;text-transform:uppercase;letter-spacing:.06em;font-weight:500;margin-bottom:5px;}
.ho-field input,.ho-field select{width:100%;border:1px solid #dde6e5;border-radius:10px;padding:9px 10px;font-size:14px;font-family:'DM Sans',sans-serif;color:#1d3a3f;background:#fbfdfc;box-sizing:border-box;}
.ho-field input:focus,.ho-field select:focus{outline:none;border-color:#3e8e82;}
.ho-save-btn{width:100%;background:#1d3a3f;color:#eaf4f3;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s;}
.ho-save-btn:hover{background:#2a4f55;}
.ho-form-hint{font-size:11.5px;color:#c07800;margin-top:10px;line-height:1.5;display:none;}
.ho-form-hint.visible{display:block;}
.ho-form-hint.ok{color:#2e8b57;}

.ho-list-section,.ho-month-section{margin-bottom:20px;}
.ho-list-section h3,.ho-month-section h3{font-family:'Playfair Display',serif;font-size:14px;color:#1d3a3f;margin-bottom:10px;padding:0 2px;}
.ho-section-hint{font-size:11px;color:#8c9b98;margin:-4px 2px 10px;line-height:1.5;}
.ho-list{background:white;border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(29,58,63,.07);}
.ho-item{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #eef3f2;gap:10px;}
.ho-item:last-child{border-bottom:none;}
.ho-item-date{font-size:13px;font-weight:500;color:#1d3a3f;}
.ho-item-date .ho-item-today{font-size:10px;color:#3e8e82;font-weight:600;}
.ho-item-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}

.ho-item-brl{font-size:10px;color:#8c9b98;}

.ho-empty{background:white;border-radius:18px;padding:24px;text-align:center;font-size:13px;color:#8c9b98;box-shadow:0 2px 12px rgba(29,58,63,.07);}

/* ===== CARD DIÁRIO ===== */
.daily-card{
  background:linear-gradient(135deg,#1e1628 0%,#231e35 100%);
  border:1px solid #3a3060;
  border-radius:18px;
  padding:18px 18px 14px;
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
}
.daily-card::before{
  content:'';
  position:absolute;
  top:-30px;right:-30px;
  width:100px;height:100px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(180,142,244,.12),transparent 70%);
}
.daily-card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.daily-card-title{
  font-family:'DM Serif Display',serif;
  font-size:.95rem;
  color:#e8e4f7;
  letter-spacing:.01em;
}
.daily-card-date{
  font-size:.55rem;
  color:#6b6490;
  font-family:'DM Mono',monospace;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.daily-med-row{
  display:flex;
  align-items:center;
  gap:13px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  padding:13px 14px;
  margin-bottom:8px;
  cursor:pointer;
  transition:all .2s;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.daily-med-row:last-child{margin-bottom:0;}
.daily-med-row:hover{background:rgba(255,255,255,.07);}
.daily-med-row.taken{
  background:rgba(76,175,138,.12);
  border-color:rgba(76,175,138,.3);
}
.daily-med-check{
  width:30px;height:30px;
  border-radius:50%;
  border:2px solid #4a4270;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-size:14px;
  transition:all .25s;
  color:transparent;
}
.daily-med-row.taken .daily-med-check{
  background:#4caf8a;
  border-color:#4caf8a;
  color:white;
}
.daily-med-info{flex:1;}
.daily-med-name{
  font-size:.88rem;
  font-weight:500;
  color:#e8e4f7;
  margin-bottom:2px;
  transition:color .2s;
}
.daily-med-row.taken .daily-med-name{
  color:#8b85a8;
  text-decoration:line-through;
}
.daily-med-when{
  font-size:.7rem;
  color:#6b6490;
  display:flex;
  align-items:center;
  gap:5px;
}
.daily-med-dot{
  width:6px;height:6px;
  border-radius:50%;
  flex-shrink:0;
}
.daily-med-dose{
  font-size:.68rem;
  font-weight:600;
  padding:2px 9px;
  border-radius:20px;
  margin-left:auto;
  flex-shrink:0;
}
.daily-reset{
  display:block;
  width:100%;
  margin-top:12px;
  padding:7px;
  background:transparent;
  border:1px solid #2e2a45;
  border-radius:8px;
  color:#4a4270;
  font-family:'DM Sans',sans-serif;
  font-size:.68rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .2s;
}
.daily-reset:hover{border-color:#b48ef4;color:#b48ef4;}
.daily-all-done{
  text-align:center;
  font-size:.75rem;
  color:#4caf8a;
  margin-top:10px;
  font-weight:500;
  letter-spacing:.05em;
  opacity:0;
  transition:opacity .4s;
}
.daily-all-done.visible{opacity:1;}

@media print{
  .bottom-nav{display:none!important;}
  body{padding-bottom:0!important;}
  #page-dor{display:block!important;}

const __APP_ID = "painelBruna";
const __KEY_PREFIXES = ["daily_meds_", "desven_days_", "med_control_", "painel_dores_", "psiq_", "painel_skincare_", "home_office_horas_", "home_office_dolar_", "home_office_bonus_", "az900_checked", "bokashi_", "saude_"];

function __keyMatches(k){
  return __KEY_PREFIXES.some(p => k === p || k.indexOf(p) === 0);
}
function __collectLocalSnapshot(){
  const snap = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(__keyMatches(k)) snap[k] = localStorage.getItem(k);
  }
  return snap;
}
let __currentUser = null;
let __pushTimer = null;
function __schedulePush(){
  clearTimeout(__pushTimer);
  __pushTimer = setTimeout(__pushNow, 900);
}
async function __pushNow(){

  try{
    await __db.collection('users').doc(__currentUser.uid).collection('apps').doc(__APP_ID).set(__collectLocalSnapshot(), {merge:true});
  }catch(e){ console.warn('sync push failed', e); }
}
const __origSetItem = Storage.prototype.setItem.bind(localStorage);
const __origRemoveItem = Storage.prototype.removeItem.bind(localStorage);
localStorage.setItem = function(k,v){ __origSetItem(k,v); if(__keyMatches(k)) __schedulePush(); };
localStorage.removeItem = function(k){ __origRemoveItem(k); if(__keyMatches(k)) __schedulePush(); };

async function __hydrateFromCloud(){
  try{
    const doc = await __db.collection('users').doc(__currentUser.uid).collection('apps').doc(__APP_ID).get();
    if(doc.exists){
      const data = doc.data();
      Object.keys(data).forEach(k=>{ __origSetItem(k, data[k]); });
    }
  }catch(e){ console.warn('sync hydrate failed', e); }
}

function __bootApp(){

  const frag = tpl.content.cloneNode(true);
  const scripts = Array.from(frag.querySelectorAll('script'));
  scripts.forEach(s=>s.remove());
  document.body.appendChild(frag);
  scripts.forEach(old=>{
    const s = document.createElement('script');
    if(old.src){ s.src = old.src; } else { s.textContent = old.textContent; }
    document.body.appendChild(s);
  });
}

  btn.classList.add('active');

}

/* ===== MEDICAÇÕES · checklist diário =====
   Dados (todos com prefixo "daily_meds_", então sincronizam com a nuvem):
   - daily_meds_log_v2 : { "2026-10-23": { desven:true, lamoAm:true, lamoPm:true, riva:true } }
   - daily_meds_cfg_v2 : { desven:[ {from:"2026-10-23", mg:50} ] }  (histórico de doses)
*/
const MED_LOG_KEY='daily_meds_log_v2';
const MED_CFG_KEY='daily_meds_cfg_v2';
const MED_WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MED_MON=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MED_MON_FULL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MED_ITEMS=[
  {id:'desven',name:'Desvenlafaxina',when:'Após uma refeição · 1x ao dia',color:'#f4a96a'},
  {id:'lamoAm',name:'Lamotrigina · manhã',when:'1 comprimido de 50 mg',dose:'50 mg',color:'#b48ef4'},
  {id:'lamoPm',name:'Lamotrigina · noite',when:'1 comprimido de 50 mg (12/12h)',dose:'50 mg',color:'#b48ef4'},
  {id:'riva',name:'Rivaroxabana',when:'Após o almoço · com refeição principal',dose:'20 mg',color:'#7ed8c8'}
];

function medKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function medParse(k){const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function medFmt(k){const p=k.split('-');return `${p[2]}/${p[1]}`;}
function medJSON(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v==null?fallback:v;}catch(e){return fallback;}}
function medSave(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}

let medLog=medJSON(MED_LOG_KEY,{});
let medCfg=medJSON(MED_CFG_KEY,null);
if(!medCfg||!Array.isArray(medCfg.desven)){
  // Ponto de partida: dose referida no relatório de 23/10/2026 (50 mg/dia)
  medCfg={desven:[{from:'2026-10-23',mg:50}]};
  medSave(MED_CFG_KEY,medCfg);
}
let medLastToday=medKey(new Date());
let medSel=medLastToday;               // dia que o card está mostrando
let medViewYm=medSel.slice(0,7);       // mês que o calendário está mostrando

// Dose da desvenlafaxina vigente em uma data (última mudança com data <= data)
function medDoseOn(key){
  let mg=null;
  medCfg.desven.slice().sort((a,b)=>a.from<b.from?-1:1).forEach(e=>{if(e.from<=key)mg=e.mg;});
  return mg;
}
function medDayCount(key){const l=medLog[key];return l?MED_ITEMS.filter(m=>l[m.id]).length:0;}

function medToggle(id){
  const l=medLog[medSel]||(medLog[medSel]={});
  if(l[id])delete l[id];else l[id]=true;
  if(!Object.keys(l).length)delete medLog[medSel];
  medSave(MED_LOG_KEY,medLog);
  medRenderAll();
}
function medClearDay(){delete medLog[medSel];medSave(MED_LOG_KEY,medLog);medRenderAll();}
function medGoToday(){medSel=medKey(new Date());medViewYm=medSel.slice(0,7);medRenderAll();}
function medPickDay(k){if(k>medKey(new Date()))return;medSel=k;medRenderAll();}
function medNavMonth(dir){
  const p=medViewYm.split('-').map(Number);
  const d=new Date(p[0],p[1]-1+dir,1);
  const ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  if(ym>medKey(new Date()).slice(0,7))return;
  medViewYm=ym;medRenderCalendar();
}

function medAddDose(){
  const mg=parseInt(document.getElementById('desven-dose-input').value,10);
  const from=document.getElementById('desven-since-input').value;
  if(!mg||!from)return;
  medCfg.desven=medCfg.desven.filter(e=>e.from!==from);
  medCfg.desven.push({from:from,mg:mg});
  medCfg.desven.sort((a,b)=>a.from<b.from?-1:1);
  medSave(MED_CFG_KEY,medCfg);
  medRenderAll();
}
function medDelDose(from){
  medCfg.desven=medCfg.desven.filter(e=>e.from!==from);
  medSave(MED_CFG_KEY,medCfg);
  medRenderAll();
}

function medStreak(){
  const d=new Date();
  if(medDayCount(medKey(d))<MED_ITEMS.length)d.setDate(d.getDate()-1);
  let n=0;
  while(medDayCount(medKey(d))===MED_ITEMS.length){n++;d.setDate(d.getDate()-1);}
  return n;
}

// Estatísticas de adesão de um mês (usado na tela e no relatório do Histórico).
// A contagem só começa no primeiro dia em que você registrou algo, para não
// "punir" dias de antes de começar a usar o painel.
function medMonthStats(ym){
  const logged=Object.keys(medLog).filter(k=>medDayCount(k)>0).sort();
  if(!logged.some(k=>k.startsWith(ym+'-')))return null;
  const p=ym.split('-').map(Number);
  const lastDay=new Date(p[0],p[1],0).getDate();
  const todayK=medKey(new Date());
  let from=ym+'-01'; if(logged[0]>from)from=logged[0];
  let to=`${ym}-${String(lastDay).padStart(2,'0')}`; if(todayK<to)to=todayK;
  const days=[];
  for(let d=medParse(from);medKey(d)<=to;d.setDate(d.getDate()+1))days.push(medKey(d));
  const per={};
  MED_ITEMS.forEach(i=>{per[i.id]=days.filter(k=>medLog[k]&&medLog[k][i.id]).length;});
  const full=days.filter(k=>medDayCount(k)===MED_ITEMS.length).length;
  const totalTaken=MED_ITEMS.reduce((s,i)=>s+per[i.id],0);
  const monthStart=ym+'-01', monthEnd=`${ym}-${String(lastDay).padStart(2,'0')}`;
  return {
    ym:ym, expected:days.length, from:from, to:to, per:per, full:full,
    pct:Math.round(100*totalTaken/(days.length*MED_ITEMS.length)),
    doseAtStart:medDoseOn(monthStart),
    doseChanges:medCfg.desven.filter(e=>e.from>monthStart&&e.from<=monthEnd).map(e=>({from:e.from,mg:e.mg}))
  };
}

function medRenderDaily(){
  const today=medKey(new Date());
  const isToday=medSel===today;
  const d=medParse(medSel);
  document.getElementById('daily-title').textContent=isToday?'Medicações de hoje':'Medicações · dia selecionado';
  document.getElementById('daily-date').textContent=`${MED_WD[d.getDay()]}, ${d.getDate()} de ${MED_MON[d.getMonth()]}`;
  const l=medLog[medSel]||{};
  const dose=medDoseOn(medSel);
  document.getElementById('daily-rows').innerHTML=MED_ITEMS.map(m=>{
    const doseTxt=m.id==='desven'?(dose?dose+' mg':'definir dose'):m.dose;
    const rgb=m.color==='#f4a96a'?'244,169,106':m.color==='#b48ef4'?'180,142,244':'126,216,200';
    return `<div class="daily-med-row${l[m.id]?' taken':''}" onclick="medToggle('${m.id}')">
      <div class="daily-med-check">${l[m.id]?'✓':''}</div>
      <div class="daily-med-info">
        <div class="daily-med-name">${m.name}</div>
        <div class="daily-med-when"><div class="daily-med-dot" style="background:${m.color}"></div>${m.when}</div>
      </div>
      <div class="daily-med-dose" style="background:rgba(${rgb},.15);color:${m.color}">${doseTxt}</div>
    </div>`;
  }).join('');
  document.getElementById('daily-alldone').classList.toggle('visible',medDayCount(medSel)===MED_ITEMS.length);
  document.getElementById('daily-back').style.display=isToday?'none':'block';
}

function medRenderDose(){
  const today=medKey(new Date());
  const mg=medDoseOn(today);
  const cur=medCfg.desven.slice().sort((a,b)=>a.from<b.from?-1:1).filter(e=>e.from<=today).pop();
  document.getElementById('desven-current').innerHTML=mg
    ?`${mg} mg<small>por dia${cur?' · desde '+medFmt(cur.from):''}</small>`:'—<small>defina uma dose abaixo</small>';
  document.getElementById('desven-history').innerHTML=medCfg.desven.slice().sort((a,b)=>a.from<b.from?1:-1).map(e=>
    `<div class="mp-hist-item"><span>${medFmt(e.from)}/${e.from.slice(0,4)} → <strong>${e.mg} mg</strong></span><button title="Remover" onclick="medDelDose('${e.from}')">×</button></div>`
  ).join('');
  const since=document.getElementById('desven-since-input');
  if(!since.value)since.value=today;
}

function medRenderCalendar(){
  const p=medViewYm.split('-').map(Number);
  const todayK=medKey(new Date());
  document.getElementById('med-month-label').textContent=`${MED_MON_FULL[p[1]-1]} / ${p[0]}`;
  document.getElementById('med-next').disabled=medViewYm>=todayK.slice(0,7);
  const first=new Date(p[0],p[1]-1,1).getDay();
  const n=new Date(p[0],p[1],0).getDate();
  let html=MED_WD.map(w=>`<div class="mc-wd">${w[0]}</div>`).join('');
  for(let i=0;i<first;i++)html+='<div class="mc-day blank"></div>';
  for(let d=1;d<=n;d++){
    const k=`${medViewYm}-${String(d).padStart(2,'0')}`;
    const c=medDayCount(k);
    const cls=['mc-day'];
    if(k>todayK)cls.push('future');
    else if(c===MED_ITEMS.length)cls.push('full');
    else if(c>0)cls.push('partial');
    if(k===todayK)cls.push('today');
    if(k===medSel)cls.push('sel');
    html+=`<div class="${cls.join(' ')}" onclick="medPickDay('${k}')">${d}</div>`;
  }
  document.getElementById('med-month-grid').innerHTML=html;
}

function medRenderStats(){
  const ym=medKey(new Date()).slice(0,7);
  const st=medMonthStats(ym);
  document.getElementById('med-stat-total').textContent=st?st.full:0;
  document.getElementById('med-stat-streak').textContent=medStreak();
  document.getElementById('med-stat-pct').textContent=st?st.pct+'%':'—';
}

function medRenderAll(){medRenderDaily();medRenderDose();medRenderCalendar();medRenderStats();}

// Se o app ficar aberto de um dia para o outro, volta o card para o novo "hoje"
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  const t=medKey(new Date());
  if(t!==medLastToday){
    if(medSel===medLastToday){medSel=t;medViewYm=t.slice(0,7);}
    medLastToday=t;
    medRenderAll();
  }
});
medRenderAll();

/* ===== PSIQUIATRIA =====
   Dados (prefixo "psiq_", sincroniza com a nuvem):
   - psiq_cfg_v1     : { next:"2026-11-23", questions:[{id,t,done}], psico:{done,when} }
   - psiq_log_v1     : { "2026-10-23": { c:{sono:true,...}, h:7, a:4, s:6, n:"texto" } }
   - psiq_efeitos_v1 : [ { id, k:"2026-10-23", t:"texto" } ]
   h = humor, a = ansiedade, s = sono (0 a 10).
*/
const PSQ_CFG_KEY='psiq_cfg_v1';
const PSQ_LOG_KEY='psiq_log_v1';
const PSQ_EFX_KEY='psiq_efeitos_v1';
// Orientações do documento da consulta de 23/10/2026
const PSQ_ORIENT=[
  {id:'sono',t:'Horários mais regulares para dormir e acordar',d:''},
  {id:'alim',t:'Manter pequenas mudanças alimentares',d:'sem exigir transformações imediatas'},
  {id:'habito',t:'Associar hábitos e recompensas',d:'as estratégias que você começou a estudar'},
  {id:'leitura',t:'Ler em períodos curtos e possíveis',d:'retomar uma atividade prazerosa'},
  {id:'fisio',t:'Fisioterapia e orientações da ortopedia',d:'respeitar a orientação da equipe ortopédica'}
];
const PSQ_SCALES=[
  {f:'h',name:'Humor',lo:'0 = muito mal',hi:'10 = muito bem'},
  {f:'a',name:'Ansiedade',lo:'0 = nenhuma',hi:'10 = máxima'},
  {f:'s',name:'Sono (noite passada)',lo:'0 = péssimo',hi:'10 = ótimo'}
];

function psqEsc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function psqId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

let psqCfg=medJSON(PSQ_CFG_KEY,null);
if(!psqCfg||typeof psqCfg!=='object'){
  psqCfg={
    next:'2026-11-23', // data estimada de retorno, segundo o relatório
    questions:[{id:psqId(),t:'Subir a desvenlafaxina para 100 mg? Quando começar?',done:false}],
    psico:{done:false,when:''}
  };
  medSave(PSQ_CFG_KEY,psqCfg);
}
let psqLog=medJSON(PSQ_LOG_KEY,{});
let psqEfx=medJSON(PSQ_EFX_KEY,[]);
let psqDate=medKey(new Date());

function psqDay(k){return psqLog[k||psqDate]||(psqLog[k||psqDate]={c:{}});}
function psqSaveLog(){
  // limpa dias vazios antes de salvar
  Object.keys(psqLog).forEach(k=>{
    const o=psqLog[k];
    const empty=!Object.keys(o.c||{}).length&&o.h==null&&o.a==null&&o.s==null&&!(o.n&&o.n.trim());
    if(empty)delete psqLog[k];
  });
  medSave(PSQ_LOG_KEY,psqLog);
}

function psqNavDay(dir){
  const d=medParse(psqDate);d.setDate(d.getDate()+dir);
  const k=medKey(d);
  if(k>medKey(new Date()))return;
  psqDate=k;psqRender();
}
function psqGoToday(){psqDate=medKey(new Date());psqRender();}

function psqToggleOrient(id){
  const o=psqDay();
  if(!o.c)o.c={};
  if(o.c[id])delete o.c[id];else o.c[id]=true;
  psqSaveLog();psqRender();
}
function psqSetScale(f,v){
  const o=psqDay();
  o[f]=(o[f]===v)?null:v;
  if(o[f]==null)delete o[f];
  psqSaveLog();psqRender();
}
function psqSetNote(v){const o=psqDay();o.n=v;psqSaveLog();}   // sem re-render para não perder o cursor

function psqSetNext(v){psqCfg.next=v||'';medSave(PSQ_CFG_KEY,psqCfg);psqRenderNext();}
function psqAddQ(){
  const el=document.getElementById('psq-q-input');
  const t=el.value.trim();if(!t)return;
  psqCfg.questions.push({id:psqId(),t:t,done:false});
  el.value='';medSave(PSQ_CFG_KEY,psqCfg);psqRenderNext();
}
function psqToggleQ(id){const q=psqCfg.questions.find(x=>x.id===id);if(q){q.done=!q.done;medSave(PSQ_CFG_KEY,psqCfg);psqRenderNext();}}
function psqDelQ(id){psqCfg.questions=psqCfg.questions.filter(x=>x.id!==id);medSave(PSQ_CFG_KEY,psqCfg);psqRenderNext();}
function psqTogglePsico(){psqCfg.psico.done=!psqCfg.psico.done;medSave(PSQ_CFG_KEY,psqCfg);psqRender();}
function psqSetPsicoWhen(v){psqCfg.psico.when=v;medSave(PSQ_CFG_KEY,psqCfg);}

function psqAddEfx(){
  const el=document.getElementById('psq-efx-input');
  const t=el.value.trim();if(!t)return;
  psqEfx.push({id:psqId(),k:psqDate,t:t});
  el.value='';medSave(PSQ_EFX_KEY,psqEfx);psqRenderEfx();psqRenderSummary();
}
function psqDelEfx(id){psqEfx=psqEfx.filter(e=>e.id!==id);medSave(PSQ_EFX_KEY,psqEfx);psqRenderEfx();psqRenderSummary();}

// Estatísticas do mês (também usadas no relatório do Histórico)
function psqMonthStats(ym){
  const days=Object.keys(psqLog).filter(k=>k.startsWith(ym+'-')).sort();
  const efx=psqEfx.filter(e=>e.k.startsWith(ym+'-')).sort((a,b)=>a.k<b.k?-1:1);
  if(!days.length&&!efx.length)return null;
  const avg=f=>{const v=days.map(k=>psqLog[k][f]).filter(x=>typeof x==='number');return v.length?Math.round(10*v.reduce((s,x)=>s+x,0)/v.length)/10:null;};
  // dias "esperados": do primeiro dia registrado (em qualquer mês) até o fim do mês / hoje
  const allDays=Object.keys(psqLog).sort();
  const p=ym.split('-').map(Number);
  const last=new Date(p[0],p[1],0).getDate();
  const todayK=medKey(new Date());
  let from=ym+'-01'; if(allDays.length&&allDays[0]>from)from=allDays[0];
  let to=`${ym}-${String(last).padStart(2,'0')}`; if(todayK<to)to=todayK;
  let expected=0;
  for(let d=medParse(from);medKey(d)<=to;d.setDate(d.getDate()+1))expected++;
  const orient={};
  PSQ_ORIENT.forEach(o=>{orient[o.id]=days.filter(k=>psqLog[k].c&&psqLog[k].c[o.id]).length;});
  const orientTotal=PSQ_ORIENT.reduce((s,o)=>s+orient[o.id],0);
  return {
    ym:ym, daysLogged:days.length, expected:expected,
    humor:avg('h'), ansiedade:avg('a'), sono:avg('s'),
    orient:orient, orientPct:expected?Math.round(100*orientTotal/(expected*PSQ_ORIENT.length)):null,
    rows:days.map(k=>({k:k,h:psqLog[k].h,a:psqLog[k].a,s:psqLog[k].s,c:Object.keys(psqLog[k].c||{}).length,n:(psqLog[k].n||'').trim()})),
    efeitos:efx.map(e=>({k:e.k,t:e.t})),
    perguntas:psqCfg.questions.map(q=>({t:q.t,done:q.done})),
    psico:{done:psqCfg.psico.done,when:psqCfg.psico.when}
  };
}

function psqRenderNext(){
  const el=document.getElementById('psq-next-count');
  const sub=document.getElementById('psq-next-sub');
  document.getElementById('psq-next-date').value=psqCfg.next||'';
  if(!psqCfg.next){el.innerHTML='—';sub.textContent='Escolha a data da consulta.';}
  else{
    const t=medParse(medKey(new Date())),n=medParse(psqCfg.next);
    const diff=Math.round((n-t)/86400000);
    const f=`${MED_WD[n.getDay()]}, ${n.getDate()} de ${MED_MON[n.getMonth()]} de ${n.getFullYear()}`;
    if(diff>1){el.innerHTML=`${diff}<small>dias</small>`;sub.textContent=`Retorno estimado: ${f} (cerca de 30 dias após 23/10). Confirme a data real com o consultório.`;}
    else if(diff===1){el.innerHTML='Amanhã';sub.textContent=f;}
    else if(diff===0){el.innerHTML='Hoje';sub.textContent=f;}
    else{el.innerHTML=`${-diff}<small>dias atrás</small>`;sub.textContent='A data já passou — atualize quando marcar a próxima consulta.';}
  }
  const qs=psqCfg.questions;
  document.getElementById('psq-q-list').innerHTML=qs.length?qs.map(q=>
    `<div class="psq-list-item"><div class="psq-item${q.done?' done':''}" style="border:none;padding:0;flex:1;" onclick="psqToggleQ('${q.id}')"><div class="psq-box">✓</div><div class="psq-t">${psqEsc(q.t)}</div></div><button class="x" title="Remover" onclick="psqDelQ('${q.id}')">×</button></div>`
  ).join(''):'<div class="psq-empty">Nenhuma pergunta ainda.</div>';
}

function psqRenderEfx(){
  const list=psqEfx.slice().sort((a,b)=>a.k<b.k?1:-1);
  document.getElementById('psq-efx-list').innerHTML=list.length?list.map(e=>
    `<div class="psq-list-item"><span class="dt">${medFmt(e.k)}</span><span>${psqEsc(e.t)}</span><button class="x" title="Remover" onclick="psqDelEfx('${e.id}')">×</button></div>`
  ).join(''):'<div class="psq-empty">Nada registrado ainda.</div>';
}

function psqRenderSummary(){
  const ym=psqDate.slice(0,7);
  const p=ym.split('-').map(Number);
  document.getElementById('psq-sum-title').textContent=`Resumo · ${MED_MON_FULL[p[1]-1]} / ${p[0]}`;
  const st=psqMonthStats(ym);
  const f=v=>v==null?'—':String(v).replace('.',',');
  document.getElementById('psq-sum').innerHTML=st
    ?`<div><b>${f(st.humor)}</b><span>Humor</span></div><div><b>${f(st.ansiedade)}</b><span>Ansiedade</span></div><div><b>${f(st.sono)}</b><span>Sono</span></div><div><b>${st.orientPct==null?'—':st.orientPct+'%'}</b><span>Orientações</span></div>`
    :'<div style="grid-column:1/-1"><span>Sem registros neste mês</span></div>';
}

function psqRender(){
  const today=medKey(new Date());
  const d=medParse(psqDate);
  document.getElementById('psq-date-label').textContent=`${MED_WD[d.getDay()]}, ${d.getDate()} de ${MED_MON_FULL[d.getMonth()].toLowerCase()}`;
  document.getElementById('psq-today-link').style.display=psqDate===today?'none':'inline';
  document.getElementById('psq-next-day').disabled=psqDate>=today;
  const o=psqLog[psqDate]||{c:{}};
  const c=o.c||{};
  document.getElementById('psq-orient').innerHTML=PSQ_ORIENT.map(it=>
    `<div class="psq-item${c[it.id]?' done':''}" onclick="psqToggleOrient('${it.id}')"><div class="psq-box">✓</div><div><div class="psq-t">${it.t}</div>${it.d?`<div class="psq-d">${it.d}</div>`:''}</div></div>`
  ).join('');
  document.getElementById('psq-orient-prog').textContent=`${Object.keys(c).length}/${PSQ_ORIENT.length}`;
  const ps=document.getElementById('psq-psico');
  ps.classList.toggle('done',!!psqCfg.psico.done);
  document.getElementById('psq-psico-when').value=psqCfg.psico.when||'';
  document.getElementById('psq-scales').innerHTML=PSQ_SCALES.map(s=>{
    let b='';
    for(let i=0;i<=10;i++)b+=`<button class="${o[s.f]===i?'on':''}" onclick="psqSetScale('${s.f}',${i})">${i}</button>`;
    return `<div class="psq-scale"><div class="psq-scale-h"><b>${s.name}</b><span>${s.lo} · ${s.hi}</span></div><div class="psq-btns">${b}</div></div>`;
  }).join('');
  const note=document.getElementById('psq-note');
  if(document.activeElement!==note)note.value=o.n||'';
  psqRenderNext();psqRenderEfx();psqRenderSummary();
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  const t=medKey(new Date());
  if(psqDate===psqLastToday&&t!==psqLastToday){psqDate=t;}
  psqLastToday=t;psqRender();
});
let psqLastToday=medKey(new Date());

const DOR_LOCAL_KEY='painel_dores_local_v1';

// Chave dinâmica por mês: painel_dores_2026-06
function dorMonthKey(year, month){return`painel_dores_${year}-${String(month+1).padStart(2,'0')}`;}
function dorCurrentKey(){const n=new Date();return dorMonthKey(n.getFullYear(),n.getMonth());}
function dorMonthLabel(year,month){
  const names=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return`${names[month]} / ${year}`;
}

let dorViewYear=new Date().getFullYear();
let dorViewMonth=new Date().getMonth();

function dorSaveLocal(data){
  try{
    const key=dorMonthKey(dorViewYear,dorViewMonth);
    localStorage.setItem(key,JSON.stringify(data));
    dorShowStatus('✓ Salvo','#4caf8a');
  }catch{dorShowStatus('⚠ Erro ao salvar','#f4a96a');}
}
function dorLoadLocal(){
  try{
    const key=dorMonthKey(dorViewYear,dorViewMonth);
    const s=localStorage.getItem(key);
    if(s)return JSON.parse(s);
    return null;
  }catch{return null;}
}

function dorPushData(data){
  dorSaveLocal(data);
}

function dorCollectData(){
  const rows=document.querySelectorAll('#dor-table-body tr');
  const data={
    month:document.getElementById('dor-month-title').value,
    meds:Array.from(document.querySelectorAll('.dor-med-check')).map(c=>c.checked),
    medOther:Array.from(document.querySelectorAll('.dor-med-item input[type="text"]')).map(i=>i.value),
    obs:Array.from(document.querySelectorAll('.dor-notes-area')).map(t=>t.value),
    days:{}
  };
  rows.forEach(row=>{
    const d=row.dataset.day;
    const intBtn=row.querySelector('.dor-int-btn[data-active="1"]');
    const sels=row.querySelectorAll('select');
    const inp=row.querySelector('input[type="text"]');
    const ta=row.querySelector('textarea');
    const rd={
      int:intBtn?parseInt(intBtn.dataset.val):0,
      loc:(sels[0]&&sels[0].value)||'',
      sym:(sels[1]&&sels[1].value)||'',
      resc:(inp&&inp.value)||'',
      notes:(ta&&ta.value)||''
    };
    if(rd.int||rd.loc||rd.sym||rd.resc||rd.notes)data.days[d]=rd;
  });
  return data;
}

function dorSaveAll(){
  clearTimeout(dorSaveTimer);
  dorSaveTimer=setTimeout(()=>{
    dorSaveTimer=null;
    const data=dorCollectData();
    dorPushData(data);
  },300);
}

function dorApplyData(saved){
  if(!saved)return;
  const tbody=document.getElementById('dor-table-body');
  tbody.querySelectorAll('tr').forEach(row=>{
    const d=row.dataset.day;
    const sd=saved.days&&saved.days[d]?saved.days[d]:{};
    if(sd.int){
      const wrap=row.querySelector('.dor-int-wrap');
      const btns=wrap.querySelectorAll('.dor-int-btn');
      btns.forEach(b=>{b.className='dor-int-btn';delete b.dataset.active;});
      const target=wrap.querySelector(`[data-val="${sd.int}"]`);
      if(target){target.className=`dor-int-btn active-${sd.int}`;target.dataset.active='1';}
    }
    const sels=row.querySelectorAll('select');
    if(sd.loc&&sels[0])sels[0].value=sd.loc;
    if(sd.sym&&sels[1])sels[1].value=sd.sym;
    const inp=row.querySelector('input[type="text"]');
    if(sd.resc&&inp)inp.value=sd.resc;
    const ta=row.querySelector('textarea');
    if(sd.notes&&ta)ta.value=sd.notes;
  });
  if(saved.meds){
    const checks=document.querySelectorAll('.dor-med-check');
    saved.meds.forEach((v,i)=>{if(checks[i])checks[i].checked=v;});
  }
  if(saved.medOther){
    const others=document.querySelectorAll('.dor-med-item input[type="text"]');
    saved.medOther.forEach((v,i)=>{if(others[i])others[i].value=v;});
  }
  if(saved.obs){
    const areas=document.querySelectorAll('.dor-notes-area');
    saved.obs.forEach((v,i)=>{if(areas[i])areas[i].value=v;});
  }
  dorUpdateSummary();
}

window.dorIntClick = function(btn, val) {
  var wrap = btn.parentNode;
  var btns = wrap.querySelectorAll('.dor-int-btn');
  var wasActive = btn.dataset.active === '1';
  for(var i=0; i<btns.length; i++){
    btns[i].className = 'dor-int-btn';
    delete btns[i].dataset.active;

    btn.dataset.active = '1';
  }
  dorUpdateSummary();
  dorSaveAll();
};

/* ===== HOME OFFICE (horas de trabalho remoto) ===== */
const HO_RATE=8;        // valor por hora trabalhada
const HO_LIMIT=10;      // limite de horas pagas por dia
const HO_STORAGE_KEY='home_office_horas_v1';
const HO_MONTHS_PT=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const HO_MONTHS_SHORT_PT=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const HO_WEEKDAYS_PT=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function hoTodayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function hoParseISO(iso){const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}
function hoToISO(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function hoCap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function hoFormatHours(dec){
  dec=Math.max(0,dec||0);
  const h=Math.floor(dec+1e-9);
  const m=Math.round((dec-h)*60);
  return m===0?`${h}h`:`${h}h${String(m).padStart(2,'0')}`;
}
function hoFormatMoney(v){return'$'+(v||0).toFixed(2).replace('.',',');}
function hoPaidHours(dec){return Math.min(dec||0,HO_LIMIT);}
function hoPaidValue(dec){return hoPaidHours(dec)*HO_RATE;}

function hoLoad(){
  try{const raw=localStorage.getItem(HO_STORAGE_KEY);const map=raw?JSON.parse(raw):{};return typeof map==='object'&&map?map:{};}catch{return{};}
}

/* ---- Cotação do dólar (USD → BRL) ---- */
const HO_RATE_STORAGE_KEY='home_office_dolar_v1'; // mapa {data:cotação}
function hoLoadRates(){
  try{const raw=localStorage.getItem(HO_RATE_STORAGE_KEY);const map=raw?JSON.parse(raw):{};return typeof map==='object'&&map?map:{};}catch{return{};}
}
function hoSaveRates(map){try{localStorage.setItem(HO_RATE_STORAGE_KEY,JSON.stringify(map));}catch{}}
// Cotação mais recente disponível no mapa, independente da data (usada como fallback)
function hoLatestRateEntry(map){
  const keys=Object.keys(map).sort();
  if(keys.length===0)return null;
  const k=keys[keys.length-1];
  return{date:k,rate:map[k]};
}
// Cotação a usar para uma data específica: a cotação salva naquele dia,
// ou — se não houver — a cotação mais recente conhecida até aquela data,
// ou — em último caso — a cotação mais recente disponível em todo o histórico.
function hoRateForDate(dateISO){
  const map=hoLoadRates();
  if(map[dateISO]!=null)return map[dateISO];
  const past=Object.keys(map).filter(k=>k<dateISO).sort();
  if(past.length>0)return map[past[past.length-1]];
  const latest=hoLatestRateEntry(map);
  return latest?latest.rate:null;
}
function hoFormatBRL(v){return'R$ '+(v||0).toFixed(2).replace('.',',');}

function hoRenderRateCard(){
  const map=hoLoadRates();
  const today=hoTodayStr();
  const display=document.getElementById('ho-rate-display');
  const updated=document.getElementById('ho-rate-updated');
  if(map[today]!=null){
    display.textContent='R$ '+Number(map[today]).toFixed(2).replace('.',',');
    updated.textContent='Atualizada hoje';
  }else{
    const latest=hoLatestRateEntry(map);
    if(latest){
      display.textContent='R$ '+Number(latest.rate).toFixed(2).replace('.',',');
      const d=hoParseISO(latest.date);
      updated.textContent=`Última cotação salva: ${String(d.getDate()).padStart(2,'0')} de ${HO_MONTHS_PT[d.getMonth()]}`;
    }else{
      display.textContent='—';
      updated.textContent='Nenhuma cotação salva ainda';
    }
  }
}
// Busca a cotação do dólar (USD→BRL) numa API pública e gratuita (AwesomeAPI).
// silent=true: tentativa automática ao abrir a aba (não mostra aviso se falhar).
async function hoFetchRate(manual){
  const btn=document.getElementById('ho-rate-refresh-btn');
  const hint=document.getElementById('ho-rate-hint');
  if(btn&&manual){btn.disabled=true;btn.textContent='Buscando...';}
  try{
    const resp=await fetch('https://economia.awesomeapi.com.br/last/USD-BRL');
    if(!resp.ok)throw new Error('resposta não-ok');
    const data=await resp.json();
    const bid=parseFloat(data&&data.USDBRL&&data.USDBRL.bid);
    if(isNaN(bid))throw new Error('valor inválido');
    const map=hoLoadRates();
    map[hoTodayStr()]=bid;
    hoSaveRates(map);
    hoRenderRateCard();
    hoRenderAll();
    if(manual&&hint){
      hint.textContent=`Cotação atualizada: R$ ${bid.toFixed(2).replace('.',',')}`;
      hint.className='ho-rate-hint visible ok';
    }
  }catch(e){
    if(manual&&hint){
      hint.textContent='Não foi possível buscar a cotação automaticamente agora (sem internet ou serviço indisponível). Você pode informar o valor manualmente abaixo.';
      hint.className='ho-rate-hint visible';
    }
  }finally{
    if(btn&&manual){btn.disabled=false;btn.textContent='🔄 Atualizar';}
  }
}
function hoSetManualRate(){
  const input=document.getElementById('ho-rate-input');
  const hint=document.getElementById('ho-rate-hint');
  const v=parseFloat((input.value||'').replace(',','.'));
  if(isNaN(v)||v<=0){
    hint.textContent='Informe um valor de cotação válido (ex: 5,35).';
    hint.className='ho-rate-hint visible';
    return;
  }
  const map=hoLoadRates();
  map[hoTodayStr()]=v;
  hoSaveRates(map);
  input.value='';
  hint.textContent=`Cotação de hoje salva manualmente: R$ ${v.toFixed(2).replace('.',',')}`;
  hint.className='ho-rate-hint visible ok';
  hoRenderRateCard();
  hoRenderAll();
}

// Ciclo de pagamento: começa no dia 15 de um mês e termina no dia 14 do mês seguinte.
// Dado uma data qualquer, retorna o início (dia 15) do ciclo ao qual ela pertence.
function hoCycleStart(d){
  let y=d.getFullYear(),m=d.getMonth();
  if(d.getDate()<15){m-=1;if(m<0){m=11;y-=1;}}
  return new Date(y,m,15);
}
function hoCycleEnd(cycleStart){return new Date(cycleStart.getFullYear(),cycleStart.getMonth()+1,14);}
function hoCycleKey(cycleStart){return`${cycleStart.getFullYear()}-${String(cycleStart.getMonth()+1).padStart(2,'0')}`;}
function hoCycleLabel(cycleStart,withYear){
  const end=hoCycleEnd(cycleStart);
  const base=`15 ${HO_MONTHS_SHORT_PT[cycleStart.getMonth()]} – 14 ${HO_MONTHS_SHORT_PT[end.getMonth()]}`;
  return withYear?`${base}/${end.getFullYear()}`:base;
}
function hoSumRange(map,startISO,endISO,bonusMap){
  let hours=0,value=0,valueBRL=0,days=0,hasRate=false,bonusValue=0,bonusValueBRL=0;
  Object.keys(map).forEach(date=>{
    if(date>=startISO&&date<=endISO){
      const h=map[date];
      const usd=hoPaidValue(h);
      hours+=h;value+=usd;days++;
      const rate=hoRateForDate(date);
      if(rate){valueBRL+=usd*rate;hasRate=true;}
    }
  });
  if(bonusMap){
    Object.keys(bonusMap).forEach(date=>{
      if(date>=startISO&&date<=endISO){
        const b=bonusMap[date]||0;
        bonusValue+=b;
        const rate=hoRateForDate(date);
        if(rate){bonusValueBRL+=b*rate;hasRate=true;}
      }
    });
  }
  return{hours,value,valueBRL,days,hasRate,bonusValue,bonusValueBRL,totalValue:value+bonusValue,totalValueBRL:valueBRL+bonusValueBRL};
}

function hoRenderSummary(){
  const map=hoLoad();
  const bonusMap=hoLoadBonuses();
  const today=hoTodayStr();
  const todayHours=map[today]||0;
  const todayUSD=hoPaidValue(todayHours);
  const todayBonus=bonusMap[today]||0;
  const todayRate=hoRateForDate(today);
  const todayTotal=todayUSD+todayBonus;
  document.getElementById('ho-today-hours').textContent=hoFormatHours(todayHours);
  document.getElementById('ho-today-value').textContent=hoFormatMoney(todayTotal)+(todayBonus>0?` (+ bônus ${hoFormatMoney(todayBonus)})`:'');
  document.getElementById('ho-today-brl').textContent=todayRate?'≈ '+hoFormatBRL(todayTotal*todayRate):'';

  const now=new Date();
  const cStart=hoCycleStart(now);
  const cEnd=hoCycleEnd(cStart);
  const cRange=hoSumRange(map,hoToISO(cStart),hoToISO(cEnd),bonusMap);
  document.getElementById('ho-cycle-hours').textContent=hoFormatHours(cRange.hours);
  document.getElementById('ho-cycle-value').textContent=hoFormatMoney(cRange.totalValue)+(cRange.bonusValue>0?` (+ bônus ${hoFormatMoney(cRange.bonusValue)})`:'');
  document.getElementById('ho-cycle-brl').textContent=cRange.hasRate?'≈ '+hoFormatBRL(cRange.totalValueBRL):'';
  document.getElementById('ho-cycle-range').textContent=hoCycleLabel(cStart);

  const mStart=new Date(now.getFullYear(),now.getMonth(),1);
  const mEnd=new Date(now.getFullYear(),now.getMonth()+1,0);
  const mRange=hoSumRange(map,hoToISO(mStart),hoToISO(mEnd),bonusMap);
  document.getElementById('ho-month-hours').textContent=hoFormatHours(mRange.hours);
  document.getElementById('ho-month-value').textContent=hoFormatMoney(mRange.totalValue)+(mRange.bonusValue>0?` (+ bônus ${hoFormatMoney(mRange.bonusValue)})`:'');
  document.getElementById('ho-month-brl').textContent=mRange.hasRate?'≈ '+hoFormatBRL(mRange.totalValueBRL):'';
}

// Ao escolher uma data que já tem registro, preenche os campos para facilitar a edição
function hoOnDateChange(){
  const date=document.getElementById('ho-input-date').value;
  const map=hoLoad();
  const hInput=document.getElementById('ho-input-h');
  const mSelect=document.getElementById('ho-input-m');
  const h=map[date];
  const hint=document.getElementById('ho-form-hint');
  hint.className='ho-form-hint';
  if(h){
    const hh=Math.floor(h+1e-9);
    const mm=Math.round((h-hh)*60);
    const roundedM=Math.round(mm/15)*15%60;
    hInput.value=hh;
    mSelect.value=String(roundedM);
  }else{
    hInput.value='';
    mSelect.value='0';
  }
}

function hoSaveEntry(){
  const dateInput=document.getElementById('ho-input-date');
  let date=dateInput.value;
  if(!date){date=hoTodayStr();dateInput.value=date;}
  const hint=document.getElementById('ho-form-hint');
  const hVal=parseFloat(document.getElementById('ho-input-h').value);
  const mVal=parseFloat(document.getElementById('ho-input-m').value)||0;
  if(isNaN(hVal)||hVal<0){
    hint.textContent='Informe um número de horas válido.';
    hint.className='ho-form-hint visible';
    return;
  }
  const decimal=hVal+mVal/60;
  if(decimal<=0){
    hint.textContent='Informe ao menos alguns minutos trabalhados.';
    hint.className='ho-form-hint visible';
    return;
  }
  if(decimal>24){
    hint.textContent='Um dia tem no máximo 24 horas :)';
    hint.className='ho-form-hint visible';
    return;
  }
  const map=hoLoad();
  map[date]=decimal;
  hoSave(map);
  if(decimal>HO_LIMIT){
    hint.textContent=`Registrado ${hoFormatHours(decimal)}. Apenas ${HO_LIMIT}h são pagas por dia (limite diário) — valor: ${hoFormatMoney(hoPaidValue(decimal))}.`;
    hint.className='ho-form-hint visible';
  }else{
    hint.textContent=`Salvo! ${hoFormatHours(decimal)} → ${hoFormatMoney(hoPaidValue(decimal))}`;
    hint.className='ho-form-hint visible ok';
  }
  hoRenderAll();
}

function hoDeleteEntry(date){
  const map=hoLoad();
  delete map[date];
  hoSave(map);
  hoRenderAll();
}

function hoRenderMonthTable(){
  const map=hoLoad();
  const bonusMap=hoLoadBonuses();
  const byMonth={};
  Object.keys(map).forEach(date=>{
    const ym=date.slice(0,7);
    if(!byMonth[ym])byMonth[ym]={hours:0,value:0,valueBRL:0,days:0,hasRate:false,bonus:0,bonusBRL:0};
    const usd=hoPaidValue(map[date]);
    const rate=hoRateForDate(date);
    byMonth[ym].hours+=map[date];
    byMonth[ym].value+=usd;
    byMonth[ym].days+=1;
    if(rate){byMonth[ym].valueBRL+=usd*rate;byMonth[ym].hasRate=true;}
  });
  Object.keys(bonusMap).forEach(date=>{
    const ym=date.slice(0,7);
    if(!byMonth[ym])byMonth[ym]={hours:0,value:0,valueBRL:0,days:0,hasRate:false,bonus:0,bonusBRL:0};
    const b=bonusMap[date]||0;
    const rate=hoRateForDate(date);
    byMonth[ym].bonus+=b;
    if(rate){byMonth[ym].bonusBRL+=b*rate;byMonth[ym].hasRate=true;}
  });
  const months=Object.keys(byMonth).sort((a,b)=>b.localeCompare(a));
  const tbody=document.getElementById('ho-month-table-body');
  if(months.length===0){
    tbody.innerHTML='<tr><td colspan="6" style="text-align:center;color:#8c9b98;padding:16px;">Sem dados ainda</td></tr>';
    return;
  }
  tbody.innerHTML=months.map(ym=>{
    const[y,m]=ym.split('-').map(Number);
    const label=`${hoCap(HO_MONTHS_PT[m-1])} ${y}`;
    const r=byMonth[ym];
    const totalValue=r.value+r.bonus;
    const totalBRL=r.valueBRL+r.bonusBRL;
    const brl=r.hasRate?hoFormatBRL(totalBRL):'—';
    const bonusCell=r.bonus>0?hoFormatMoney(r.bonus):'—';
    return`<tr><td>${label}</td><td>${hoFormatHours(r.hours)}</td><td>${r.days}</td><td>${bonusCell}</td><td class="ho-table-value">${hoFormatMoney(totalValue)}</td><td class="ho-table-value-brl">${brl}</td></tr>`;
  }).join('');
}

function hoRenderCycleTable(){
  const map=hoLoad();
  const bonusMap=hoLoadBonuses();
  const byCycle={};
  Object.keys(map).forEach(date=>{
    const cStart=hoCycleStart(hoParseISO(date));
    const key=hoCycleKey(cStart);
    if(!byCycle[key])byCycle[key]={start:cStart,hours:0,value:0,valueBRL:0,days:0,hasRate:false,bonus:0,bonusBRL:0};
    const usd=hoPaidValue(map[date]);
    const rate=hoRateForDate(date);
    byCycle[key].hours+=map[date];
    byCycle[key].value+=usd;
    byCycle[key].days+=1;
    if(rate){byCycle[key].valueBRL+=usd*rate;byCycle[key].hasRate=true;}
  });
  Object.keys(bonusMap).forEach(date=>{
    const cStart=hoCycleStart(hoParseISO(date));
    const key=hoCycleKey(cStart);
    if(!byCycle[key])byCycle[key]={start:cStart,hours:0,value:0,valueBRL:0,days:0,hasRate:false,bonus:0,bonusBRL:0};
    const b=bonusMap[date]||0;
    const rate=hoRateForDate(date);
    byCycle[key].bonus+=b;
    if(rate){byCycle[key].bonusBRL+=b*rate;byCycle[key].hasRate=true;}
  });
  const keys=Object.keys(byCycle).sort((a,b)=>b.localeCompare(a));
  const tbody=document.getElementById('ho-cycle-table-body');
  if(keys.length===0){
    tbody.innerHTML='<tr><td colspan="6" style="text-align:center;color:#8c9b98;padding:16px;">Sem dados ainda</td></tr>';
    return;
  }
  tbody.innerHTML=keys.map(key=>{
    const r=byCycle[key];
    const label=hoCycleLabel(r.start,true);
    const totalValue=r.value+r.bonus;
    const totalBRL=r.valueBRL+r.bonusBRL;
    const brl=r.hasRate?hoFormatBRL(totalBRL):'—';
    const bonusCell=r.bonus>0?hoFormatMoney(r.bonus):'—';
    return`<tr><td>${label}</td><td>${hoFormatHours(r.hours)}</td><td>${r.days}</td><td>${bonusCell}</td><td class="ho-table-value">${hoFormatMoney(totalValue)}</td><td class="ho-table-value-brl">${brl}</td></tr>`;
  }).join('');
}

function hoRenderAll(){
  const dateInput=document.getElementById('ho-input-date');
  if(dateInput&&!dateInput.value)dateInput.value=hoTodayStr();

            { type:"calcio",label:"Forth Cálcio",dose:"Diluído",interval:14,note:"Quinzenal na frutificação." }]},
